  if(dphase==='ask'){
    h+='<div style="margin-top:14px;display:flex;gap:9px;flex-wrap:wrap">'+
      '<span class="btn pri big" onclick="startTimer()">开始计时并作答</span>'+
      '<span class="btn" onclick="reveal()">跳过计时，直接看答案</span>'+
      '<span class="btn" onclick="pick()">换一题</span></div>';
  }else if(dphase==='timing'){
    h+='<div style="margin-top:14px;display:flex;gap:9px;flex-wrap:wrap">'+
      '<span class="btn pri big" onclick="reveal()">我说完了，看答案</span>'+
      '<span class="btn" onclick="pick()">跳过这题</span></div>';
  }else{
    h+='<div class="card" style="margin-top:14px">'+
      '<div class="lvh" style="color:var(--ac2)">10 秒版</div>'+
      '<div class="enbox en" style="border-left-color:var(--ac2)">'+esc(dq.l1)+'</div>'+
      '<div class="lvh" style="color:var(--ac);margin-top:16px">40 秒标准答案</div>'+
      '<div class="enbox en">'+esc(dq.l2)+'</div>'+
      '<div class="zh"><b>怎么讲：</b>'+esc(dq.l2z)+'</div>'+
      '<div class="kw" style="margin-top:12px"><span class="tiny muted" style="display:block;margin-bottom:5px">必须说到的关键词——对照一下你刚才说全了吗：</span>'+
        dq.kw.map(function(k){return '<b>'+esc(k)+'</b>';}).join('')+'</div>'+
      '<div class="warn" style="margin-top:14px"><b>常见错答：</b>'+esc(dq.trap)+'</div>'+
      '<div style="margin-top:12px"><span class="btn sm" onclick="openQ(\''+dq.id+'\')">看完整分层版（含追问）</span></div>'+
      '</div>'+
     '<div class="card"><b style="font-size:14.5px">诚实自评：刚才你说得怎么样？</b>'+
      '<p class="tiny muted" style="margin:4px 0 0">别手软。评低了系统会更频繁地推回来，这正是它的用处。</p>'+
      '<div class="rate">'+
       '<span class="btn" style="border-color:var(--ac5);color:var(--ac5)" onclick="rate(1)">完全说不出<small>关键词一个没提到</small></span>'+
       '<span class="btn" style="border-color:var(--ac3);color:var(--ac3)" onclick="rate(2)">磕磕巴巴<small>意思到了但不流畅／漏了关键词</small></span>'+
       '<span class="btn" style="border-color:var(--ac2);color:var(--ac2)" onclick="rate(3)">说清楚了<small>结构完整，关键词说到了</small></span>'+
      '</div></div>';
  }
  el('v-drill').innerHTML=h;
  if(dphase!=='ask')paintTimer();
}

/* ---------- dashboard ---------- */
function drawDash(){
  var total=QS.length;
  var pts=0; QS.forEach(function(q){var s=SC_[q.id]; pts+= s? (s.r===3?1:s.r===2?0.5:0.15) : 0;});
  var score=Math.round(pts/total*100);
  var lab = score>=80?'可以上场了':score>=55?'骨架有了，继续磨':score>=25?'刚起步':'还没开始';
  var col = score>=80?'var(--ac2)':score>=55?'var(--ac3)':'var(--ac5)';
  var h='<h1>准备度仪表盘</h1><p class="sub">分数按自评算：说清楚了=100%，磕巴=50%，说不出=15%，没练过=0。<b>它衡量的是「你能说出来多少」，不是「你读过多少」。</b></p>'+
   '<div class="card"><div class="ring">'+
     '<div><div class="score" style="color:'+col+'">'+score+'<span style="font-size:22px">%</span></div>'+
     '<div class="tiny muted">面试准备度</div></div>'+
     '<div style="flex:1;min-width:230px"><div style="font-size:17px;font-weight:600;color:'+col+'">'+lab+'</div>'+
     '<p class="tiny muted" style="margin:5px 0 0">已练 '+Object.keys(SC_).length+' / '+total+' 题 · 说清楚 '+
       QS.filter(function(q){return SC_[q.id]&&SC_[q.id].r===3;}).length+' 题</p></div></div></div>'+
   '<h2 class="sec">按主题看：哪块稳，哪块虚</h2><div class="card">';
  TP.forEach(function(t){
    var qs=QS.filter(function(q){return q.topic===t.k;});
    var p=0; qs.forEach(function(q){var s=SC_[q.id];p+= s?(s.r===3?1:s.r===2?0.5:0.15):0;});
    var pc=Math.round(p/qs.length*100);
    h+='<div class="trow"><div class="tn" style="color:'+t.color+'">'+esc(t.label)+'</div>'+
      '<div class="bar"><i style="width:'+pc+'%;background:'+t.color+'"></i><span>'+pc+'%</span></div></div>';
  });
  h+='</div>';
  // today's list
  var weak=QS.slice().sort(function(a,b){
    var sa=SC_[a.id],sb=SC_[b.id];
    var wa=sa?sa.r:0, wb=sb?sb.r:0;
    if(wa!==wb)return wa-wb;
    return (a.core===b.core)?0:(a.core?-1:1);
  }).slice(0,5);
  h+='<h2 class="sec">今天先练这 5 题</h2><p class="sub" style="margin-top:-6px">没练过的排最前，其次是你自评「说不出」和「磕巴」的。</p>';
  weak.forEach(function(q){
    var s=SC_[q.id];
    var n=s?(s.r===3?['已掌握','var(--ac2)']:s.r===2?['磕巴','var(--ac3)']:['说不出','var(--ac5)']):['没练过','var(--tx3)'];
    h+='<div class="wq" onclick="openQ(\''+q.id+'\')"><span class="n" style="background:'+n[1]+'">'+n[0]+'</span>'+
      '<div style="flex:1"><div style="font-size:14px;font-weight:600">'+esc(q.q)+'</div>'+
      '<div class="tiny muted">'+esc(q.qz)+'</div></div></div>';
  });
  h+='<div style="margin-top:14px"><span class="btn pri" onclick="go(\'drill\');pick()">直接进入模拟面试 →</span> '+
     '<span class="btn sm" onclick="if(confirm(\'确定清空所有自评记录？\')){SC_={};saveScores();drawDash();drawStudy();}">清空进度</span></div>';
  el('v-dash').innerHTML=h;
}

/* ---------- cheat ---------- */
function drawCheat(){
  el('v-cheat').innerHTML='<h1>一页纸速记</h1>'+
   '<p class="sub">面试前 30 分钟看这一页就够。可以直接 Ctrl/Cmd + P 打印成一张纸带着。</p>'+
   '<div class="card"><div class="lvh" style="color:var(--ac)">项目一句话</div><div class="enbox en">'+esc(CH.one_liner)+'</div>'+
    '<div class="lvh" style="color:var(--ac);margin-top:16px">架构一句话</div><div class="enbox en">'+esc(CH.arch)+'</div>'+
    '<div class="lvh" style="color:var(--ac);margin-top:16px">核心工程原则</div><div class="enbox en">'+esc(CH.principle)+'</div>'+
    '<div class="lvh" style="color:var(--ac);margin-top:16px">最好用的取舍句</div><div class="enbox en">'+esc(CH.tradeoff)+'</div></div>'+
   '<h2 class="sec">背下这五句，覆盖 70% 的追问</h2><div class="card five">'+
    CH.five.map(function(f){return '<div class="it"><div style="font-size:13.5px;font-weight:700;color:var(--ac3);margin-bottom:4px">'+esc(f[0])+'</div>'+
      '<div class="en">'+esc(f[1])+'</div></div>';}).join('')+'</div>'+
   '<h2 class="sec">记住这几个数字</h2><div class="numgrid">'+
    CH.numbers.map(function(n){return '<div class="num"><b>'+esc(n[0])+'</b><small>'+esc(n[1])+'</small></div>';}).join('')+'</div>'+
   '<h2 class="sec">临场别踩这些坑</h2><div class="card"><div style="font-size:13.8px;line-height:2">'+
    CH.traps.map(function(t){return '<div style="display:flex;gap:9px"><span style="color:var(--ac5);font-weight:700">✕</span><span>'+esc(t)+'</span></div>';}).join('')+
    '</div></div>'+
   '<div class="card" style="border-color:var(--ac2)"><b>最后一条：不知道就说不知道。</b>'+
    '<p class="tiny" style="margin:6px 0 0">"I haven\'t gone deep on that — here\'s what I do know, and here\'s how I\'d find out." '+
    '这句话不会让你减分。编一个听起来合理的答案然后被追问穿帮，才会。</p></div>';
}

/* ---------- theme & zoom ---------- */
var ZS=[0.9,1,1.15,1.3,1.5], zi=1;
function setTheme(t){document.body.className=t;ls('drill.theme',t);var s=el('theme');if(s)s.value=t;}
function setZoom(d){if(d===0)zi=1;else zi=Math.max(0,Math.min(ZS.length-1,zi+d));
  document.documentElement.style.setProperty('--zoom',ZS[zi]);ls('drill.zoom',String(zi));
  var l=el('zlab');if(l)l.textContent=Math.round(ZS[zi]*100)+'%';}
(function(){var t=ls('drill.theme')||'t-light';document.body.className=t;
  var z=parseInt(ls('drill.zoom')||'1',10);zi=isNaN(z)?1:z;
  document.documentElement.style.setProperty('--zoom',ZS[zi]);
  setTimeout(function(){var s=el('theme');if(s)s.value=t;var l=el('zlab');if(l)l.textContent=Math.round(ZS[zi]*100)+'%';},0);})();

document.addEventListener('keydown',function(e){
  if(cur!=='drill')return;
  if(e.key===' '){e.preventDefault(); if(dphase==='ask')startTimer(); else if(dphase==='timing')reveal();}
  if(e.key==='n'||e.key==='N')pick();
  if(dphase==='answer'){ if(e.key==='1')rate(1); if(e.key==='2')rate(2); if(e.key==='3')rate(3); }
});

drawStudy(); drawCheat(); renderTabs();
</script>
</body>
</html>
