<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus 系统设计手册 · System Design Handbook</title>
<style>
:root, body.t-light{
  --bg:#fff; --bg2:#f6f8fb; --bg3:#eaeef4; --line:#d5dce6; --line2:#b4bfcf;
  --tx:#101419; --tx2:#454f5e; --tx3:#6f7a89;
  --ac:#1f56d6; --ac2:#0a6f4c; --ac3:#8a5000; --ac4:#6d2ea0; --ac5:#b52626;
  --hdr:rgba(255,255,255,.96); --onac:#fff; --sh:0 1px 2px rgba(16,20,25,.06); --r:12px;
}
body.t-eye{ --bg:#cfe8d2; --bg2:#dceedd; --bg3:#e7f4e8; --line:#a8c9ac; --line2:#8cb492;
  --tx:#15251a; --tx2:#3d5443; --tx3:#5f7565;
  --ac:#14539b; --ac2:#0a6236; --ac3:#7d4900; --ac4:#5f2b8f; --ac5:#a32222;
  --hdr:rgba(207,232,210,.96); --onac:#fff; --sh:0 1px 2px rgba(21,37,26,.07);}
body.t-sepia{ --bg:#f6efe0; --bg2:#fbf6ea; --bg3:#efe6d3; --line:#ddd0b6; --line2:#c6b696;
  --tx:#241f17; --tx2:#544c3c; --tx3:#7d7360;
  --ac:#1a54c4; --ac2:#0b6b45; --ac3:#8a4a00; --ac4:#6b2c9c; --ac5:#b02525;
  --hdr:rgba(246,239,224,.96); --onac:#fff; --sh:0 1px 2px rgba(36,31,23,.07);}
body.t-dark{ --bg:#0e1117; --bg2:#151a23; --bg3:#1b222d; --line:#252d3a; --line2:#3d4759;
  --tx:#e6e9ef; --tx2:#9aa4b5; --tx3:#7d8798;
  --ac:#7c9cff; --ac2:#5ec8a0; --ac3:#e0a458; --ac4:#c07de0; --ac5:#e07d7d;
  --hdr:rgba(14,17,23,.94); --onac:#0e1117; --sh:none;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
header{flex:0 0 auto;background:var(--hdr);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.hin{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}.brand span{color:var(--ac)}
.navsel{flex:1;min-width:150px}
select,input{background:var(--bg2);border:1px solid var(--line2);color:var(--tx);
  padding:6px 10px;border-radius:8px;font-size:13.3px;outline:none;font-family:inherit;max-width:100%}
.btn{display:inline-block;padding:6px 12px;border-radius:8px;background:var(--bg3);
  border:1px solid var(--line2);color:var(--tx);cursor:pointer;font-size:13px;
  font-family:inherit;transition:.12s;user-select:none}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.sm{padding:4px 9px;font-size:12.3px;min-width:32px;text-align:center}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 120px;zoom:var(--zoom,1)}

/* toc */
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-bottom:30px}
.tc{border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:11px 14px;
  cursor:pointer;transition:.12s;display:flex;gap:11px;align-items:flex-start;box-shadow:var(--sh)}
.tc:hover{border-color:var(--ac)}
.tc b{color:var(--ac);font-size:12.5px;font-variant-numeric:tabular-nums;flex-shrink:0;margin-top:2px}
.tc .t1{font-size:13.6px;font-weight:600;line-height:1.4}
.tc .t2{font-size:11.8px;color:var(--tx2);line-height:1.4}

/* chapter */
.ch{margin-bottom:44px;scroll-margin-top:12px}
.chh{display:flex;align-items:flex-start;gap:14px;padding-bottom:11px;
  border-bottom:2px solid var(--ac);margin-bottom:14px}
.chn{font-size:30px;font-weight:800;color:var(--ac);line-height:1;font-variant-numeric:tabular-nums;opacity:.35}
.chh h2{margin:0;font-size:21px;line-height:1.3}
.chh .zh{font-size:13.5px;color:var(--tx2);margin-top:2px}
.lead{background:var(--bg2);border-left:3px solid var(--ac);border-radius:0 10px 10px 0;
  padding:12px 16px;margin-bottom:18px;font-size:13.8px;line-height:1.8}
.lead .le{display:block;margin-top:7px;color:var(--tx2);font-size:13px;font-style:italic}
h3.bh{font-size:15.5px;margin:26px 0 12px;padding-left:11px;border-left:3px solid var(--ac3)}

/* diagram */
.dwrap{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin:16px 0;box-shadow:var(--sh);overflow-x:auto}
svg.dgm{width:100%;height:auto;min-width:720px;display:block}
.dcap{font-size:12.3px;color:var(--tx2);margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}

/* content blocks */
.pairs{display:grid;gap:10px}
.pr{border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:12px 15px;box-shadow:var(--sh)}
.pr .k{font-size:13px;font-weight:700;color:var(--ac);margin-bottom:5px}
.zhx{font-size:13.7px;line-height:1.85}
.enx{font-size:13.4px;line-height:1.8;color:var(--tx2);font-style:italic;
  border-left:2px solid var(--line2);padding-left:11px;margin-top:8px}
.enx::before{content:"EN  ";font-style:normal;font-weight:700;font-size:10.5px;
  color:var(--ac2);letter-spacing:.5px}
.steps{counter-reset:s}
.st{counter-increment:s;position:relative;padding-left:40px;margin-bottom:14px}
.st::before{content:counter(s);position:absolute;left:0;top:1px;width:27px;height:27px;border-radius:8px;
  background:var(--ac);color:var(--onac);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12.5px}
.plain{border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:13px 16px;box-shadow:var(--sh)}

/* status list */
.stt{display:grid;gap:8px}
.si{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 14px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg2)}
.si .n{font-size:13px;font-weight:700}
.si.ok{border-left:3px solid var(--ac2)}
.si.warn{border-left:3px solid var(--ac3)}
.si.no{border-left:3px solid var(--ac5)}
.si .d{font-size:13.2px}
.si .e{font-size:12.6px;color:var(--tx2);font-style:italic;margin-top:4px}

/* nfr */
.nfr{border:1px solid var(--line);border-radius:11px;background:var(--bg2);
  padding:14px 16px;margin-bottom:11px;box-shadow:var(--sh)}
.nfr .t{font-size:14.2px;font-weight:700;color:var(--ac);margin-bottom:9px}
.nfr .row{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:13.2px;margin-bottom:5px}
.nfr .lb{font-size:11.3px;font-weight:700;padding:1px 8px;border-radius:6px;text-align:center;
  height:20px;line-height:18px;border:1px solid}
.lb.g{color:var(--ac4);border-color:var(--ac4)}
.lb.n{color:var(--ac2);border-color:var(--ac2)}
.lb.x{color:var(--ac5);border-color:var(--ac5)}

/* selection */
.sel{border:1px solid var(--line);border-radius:11px;background:var(--bg2);
  padding:15px 17px;margin-bottom:12px;box-shadow:var(--sh)}
.sel .t{font-size:14.5px;font-weight:700;margin-bottom:3px}
.sel .alt{font-size:12.3px;color:var(--tx3);margin-bottom:10px}
.sel .pick{display:inline-block;padding:3px 11px;border-radius:7px;background:var(--ac);
  color:var(--onac);font-size:12.8px;font-weight:700;margin-bottom:9px}
.sel .g{display:grid;grid-template-columns:66px 1fr;gap:9px;font-size:13.2px;margin-bottom:6px;line-height:1.75}
.sel .gk{font-size:11.3px;font-weight:700;color:var(--tx3);padding-top:3px}

/* risk */
.rk{border:1px solid var(--line);border-left:3px solid var(--ac5);border-radius:0 10px 10px 0;
  background:var(--bg2);padding:12px 15px;margin-bottom:9px}
.rk .t{font-size:13.5px;font-weight:700;color:var(--ac5)}
.rk .w{font-size:12.5px;color:var(--tx3);margin-bottom:6px}
.rk .m{font-size:13.2px;line-height:1.8}

/* rank / road */
.rr{display:grid;grid-template-columns:52px 1fr;gap:13px;padding:12px 15px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg2);margin-bottom:9px}
.rr .p{font-size:12px;font-weight:800;text-align:center;padding:3px 0;border-radius:7px;
  color:var(--onac);height:26px;line-height:20px}
.rr .t{font-size:13.8px;font-weight:700}
.rr .m{font-size:11.6px;color:var(--tx3);float:right;font-weight:600}

.say{border:1px solid var(--ac2);border-radius:11px;background:var(--bg2);padding:15px 17px;margin-top:20px}
.say .h{font-size:11.5px;font-weight:800;letter-spacing:.6px;color:var(--ac2);margin-bottom:8px}
.say .b{font-size:14px;line-height:1.9}
.top{position:fixed;right:18px;bottom:18px;z-index:40}
@media(max-width:720px){
  .wrap{padding:16px 13px 90px}.si{grid-template-columns:1fr}
  .chn{font-size:22px}.chh h2{font-size:18px}
}
@media print{header,.top{display:none}html,body,main{overflow:visible;height:auto}
  .ch{break-inside:avoid-page}.dwrap{break-inside:avoid}}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
</style>
</head>
<body class="t-light">
<header><div class="hin">
  <div class="brand">系统设计<span>手册</span></div>
  <div class="navsel"><select id="nav" onchange="jump(this.value)"></select></div>
  <span class="btn sm" onclick="window.print()">打印</span>
  <select id="theme" onchange="setTheme(this.value)">
    <option value="t-light">☀ 白色</option><option value="t-eye">🌿 护眼绿</option>
    <option value="t-sepia">📜 米黄</option><option value="t-dark">🌙 夜间</option>
  </select>
  <span class="btn sm" onclick="setZoom(-1)">A−</span>
  <span class="btn sm" id="zlab" onclick="setZoom(0)">100%</span>
  <span class="btn sm" onclick="setZoom(1)">A+</span>
</div></header>
<main id="scroller"><div class="wrap" id="body"></div></main>
<div class="top"><span class="btn" onclick="scroller().scrollTo({top:0,behavior:'smooth'})">↑ 顶部</span></div>

<script id="DATA" type="application/json">{"chapters": [{"id": "c1", "n": "01", "title": "High-Level Architecture", "tz": "总体架构与设计方法", "lead_zh": "面试官问「你的架构是怎么设计出来的」时，他要听的不是组件清单，而是**你依据什么把边界画在那里**。下面先给方法，再给图。", "lead_en": "When asked how you designed it, describe the constraints and the boundaries they forced — not a component list.", "diagram": "d1", "dgm_cap": "Argus 七层架构。颜色区分职责：蓝=入口/状态，绿=校验/证据，橙=编排，紫=确定性计算，红=不可控外部依赖。", "blocks": [{"h": "设计方法：四步 / The four-step method", "kind": "steps", "items": [{"zh": "**① 先定不变量（invariants）**：这个系统无论如何不能违反什么？我定了三条——任何用户可执行的数字不得由模型产生；每条引用必须能回溯到来源和页码；证据不足时必须拒答。", "en": "I started from invariants rather than components. Three rules: no actionable number is produced by the model, every citation resolves to a source and page, and insufficient evidence must produce a refusal."}, {"zh": "**② 由不变量推出边界**：「数字不由模型产生」直接推出确定性领域层必须独立于模型调用；「必须拒答」推出证据门必须是一个可测试的规则组件，而不是藏在 prompt 里。", "en": "The invariants dictated the boundaries. 'No model-generated numbers' forced a deterministic domain layer separate from any model call; 'must be able to refuse' forced the evidence gate to be a testable component rather than prompt wording."}, {"zh": "**③ 把不可控的东西隔离到边缘**：模型供应商、Exa、Robinhood 都会挂、改价、改 schema。它们全部被放在统一接口后面（providers/、search/、integrations/），核心流程不直接依赖任何一家。", "en": "Everything I don't control — model providers, the search API, the brokerage MCP server — sits behind a uniform interface at the edge, so the core flow never depends on a specific vendor."}, {"zh": "**④ 选最无聊的实现**：一个数据库、一个 Agent 循环、一台机器。每个「无聊选择」我都写下了会让我改变主意的条件，这样它是决策而不是偷懒。", "en": "Then I chose the boring option at every level — one database, one agent loop, one host — and wrote down the condition that would make me change my mind. That's what makes it a decision instead of laziness."}]}, {"h": "七层各自负责什么 / What each layer owns", "kind": "pairs", "items": [{"k": "① Client", "zh": "React 单页应用，五个工作区按用户工作流排序。只渲染结构化字段，不解析模型散文里的数字。", "en": "A React SPA that renders numbers from structured response fields, never parsed out of model prose."}, {"k": "② API", "zh": "唯一入口。Pydantic 在边界完成校验，前端永远不直接连数据库。", "en": "The only entry point. Pydantic validates at the boundary; the browser never touches PostgreSQL."}, {"k": "③ Orchestration", "zh": "Agent Harness 持有目标、工具表、预算和停止条件。模型本身不是 Agent，是这层外壳让它成为 Agent。", "en": "The harness owns the objective, tool registry, budget, and stop conditions. A model isn't an agent; the harness is what makes it one."}, {"k": "④ Domain", "zh": "确定性计算。所有钱、比例、股数在这里产生，可单元测试、可复现。", "en": "Deterministic computation. Every dollar amount, percentage, and share count originates here, unit-tested and reproducible."}, {"k": "⑤ Retrieval & Evidence", "zh": "混合检索 + 证据门 + critic。决定「够不够答」和「引用可不可信」。", "en": "Hybrid retrieval, the evidence gate, and the critic — they decide whether we may answer and whether a citation actually supports its claim."}, {"k": "⑥ External", "zh": "全部不可控依赖。统一接口 + 显式失败，绝不静默降级到别的供应商。", "en": "All uncontrolled dependencies, behind a uniform interface with explicit failures — never a silent fallback to a different provider."}, {"k": "⑦ State", "zh": "PostgreSQL 是唯一事实来源；Redis 放可重建的任务状态；Kafka 放可重放的事实。", "en": "PostgreSQL is the system of record; Redis holds reconstructible job state; Kafka holds replayable facts."}]}], "say": "I designed it from invariants, not components. Three rules — no model-generated actionable numbers, every citation resolvable to source and page, and a mandatory refusal when evidence is insufficient — forced the boundaries: a deterministic domain layer, a testable evidence gate, and every uncontrolled dependency isolated behind a uniform interface at the edge. Then I chose the boring implementation at every level and wrote down what would make me change my mind."}, {"id": "c2", "n": "02", "title": "Request Flow", "tz": "请求流程：一次问答完整走一遍", "lead_zh": "这是最常被要求「walk me through」的部分。按十步讲，每一步带一个「为什么」，这样任何一层被追问你都接得住。", "lead_en": "The most common 'walk me through' request. Ten steps, each with a reason attached.", "diagram": "d2", "dgm_cap": "读路径（同步）。③④ 决定花多少钱，⑥ 决定要不要答，⑦ 决定数字对不对，⑨ 决定引用可不可信。", "blocks": [{"h": "写路径：为什么上传必须异步 / The async write path", "kind": "plain", "zh": "文档解析慢且吃内存。如果放在 HTTP 请求里，用户要盯着转圈几十秒，而且一个大文件能把整个 API 进程拖垮。所以：API 只做准入检查并入队，立刻返回 job_id；worker 出队执行；解析跑在**独立子进程**里，它被 OOM 杀掉只死子进程。", "en": "Parsing is slow and memory-hungry, so the API only admits and enqueues, then returns a job id immediately. The worker dequeues it and runs extraction in a child process, so a pathological file kills the child, not the API."}, {"h": "", "kind": "diagram", "diagram": "d3", "dgm_cap": "异步导入路径。注意「上传成功」与「解析成功」是两个独立可见状态。"}, {"h": "三条路径的区别 / Three distinct paths", "kind": "pairs", "items": [{"k": "同步读路径 Sync read", "zh": "问答。用户在等，必须有超时和预算上限。", "en": "Question answering — the user is waiting, so it needs a timeout and a budget ceiling."}, {"k": "异步写路径 Async write", "zh": "文档导入。用户不等，允许慢，但必须有可见状态和幂等。", "en": "Ingestion — nobody is waiting, so it can be slow, but it needs visible status and idempotency."}, {"k": "事件路径 Event path", "zh": "Run 终态事件。业务已经完成，纯粹给审计和指标用，失败不能影响业务。", "en": "Run terminal events — the business work is already done, so a publish failure must never fail the run."}]}], "say": "A question hits FastAPI where Pydantic validates it, then a deterministic routing policy picks Fast, Standard, or Deep and sets the budget. The harness opens a run and calls the retrieval tool, which fans out to exact, full-text, and vector search and fuses them with RRF. The evidence gate scores coverage — below threshold the run stops and returns a refusal. Above it, deterministic code computes the numbers, the model writes the explanation, and a critic verifies each citation supports its claim. Finally the run trace and the usage ledger are written in one transaction, and a terminal event goes to Kafka."}, {"id": "c3", "n": "03", "title": "Functional Scope", "tz": "完成了哪些功能（以及明确没做的）", "lead_zh": "面试最忌讳含糊。把「已实现 / 部分实现 / 明确未做」分清楚，比把所有东西都说成已完成可信得多。", "lead_en": "Being precise about what's shipped, partial, and deliberately absent is more credible than claiming everything works.", "blocks": [{"h": "已实现 / Shipped", "kind": "status", "tone": "ok", "items": [["文档导入", "PDF / CSV / Markdown 解析、分块、向量化、索引，content_hash 幂等", "Ingestion with chunking, embedding, indexing, and content-hash idempotency"], ["混合检索", "精确匹配 + PostgreSQL tsvector/GIN 全文 + pgvector HNSW 语义 + 加权 RRF 融合", "Exact + full-text + vector retrieval fused with weighted RRF"], ["证据门与拒答", "覆盖率评分、不足则拒答、清空引用、禁用报告生成、时间维度守卫", "Coverage scoring with hard refusal, cleared citations, disabled reports, and a temporal guard"], ["结构化 claim 与 critic", "claim ↔ evidence id，supports/contradicts 关系，引用支撑校验", "Structured claims linked to evidence IDs with a citation-support critic"], ["多供应商模型接入", "Gemini / DeepSeek / Kimi / Mock 统一接口，供应商锁，显式错误", "Uniform provider interface with provider lock and explicit failure surfacing"], ["独立网页检索", "Exa 作为独立证据源，搜索与回答模型解耦", "Exa as an independent evidence source, decoupled from the answer model"], ["确定性投资计算", "目标配置、再平衡金额与股数、DCA、现金目标可行性、退休倒推、ETF 打分排序", "Deterministic allocation, rebalancing, DCA, cash-goal feasibility, retirement back-solve, ETF ranking"], ["券商只读接入", "Robinhood MCP Host + sidecar，本地白名单强制只读，schema 指纹", "Read-only Robinhood MCP integration via a sidecar with a local allowlist and schema fingerprints"], ["成本可观测与账本", "Run/工具/模型调用轨迹 + 只增用量账本 + 供应商账单快照三层分离", "Run traces plus an append-only usage ledger plus imported provider billing snapshots"], ["异步与事件", "Redis 任务队列 + worker；Kafka 终态事件 + 去重消费 + DLQ + 保留策略", "Redis job queue with a worker, Kafka terminal events with dedupe, DLQ, and retention"], ["资源保护", "流式上传、准入控制、子进程隔离、软阈值、容器 mem_limit、显式停止原因", "Streaming upload, admission control, child-process isolation, soft thresholds, container limits"], ["评测体系", "固定题集 eval runner（引用支撑、拒答正确性、prompt injection）+ 跨模型成本-质量基准", "An eval runner over a fixed set plus a cross-provider cost/quality benchmark"], ["容器化与上云", "Compose 三套（本地/事件栈/EC2）、ECR 镜像、Terraform、本地 kind 集群 K8s 验收、EC2 冒烟", "Compose stacks, ECR images, Terraform, a local kind validation, and a bounded EC2 smoke test"]]}, {"h": "部分实现 / Partial", "kind": "status", "tone": "warn", "items": [["Kafka 运维成熟度", "管道通了，但只有一个消费者，没有 lag 告警，没演练过回放", "The pipeline works but there's one consumer, no lag alerting, and no rehearsed replay"], ["claim 抽取", "在我自己的答案格式上可靠，不是通用抽取器", "Reliable on my own answer shapes, not a general-purpose extractor"], ["评测覆盖", "题集小、期望答案由我自己写，能抓回归但衡量不了绝对质量", "Small suite with self-authored expectations — good for regressions, weak for absolute quality"], ["K8s", "manifests 在本地 kind 上验证过，没有上过托管集群", "Manifests validated on a local kind cluster, never run on a managed control plane"]]}, {"h": "明确未做 / Deliberately not built", "kind": "status", "tone": "no", "items": [["Reranking", "检索结果没有二次精排——要先有 eval 证明检索是瓶颈", "No reranker — I'd want evals showing retrieval is the bottleneck first"], ["多用户与鉴权", "单用户本地/自托管场景，没有账号体系、租户隔离、RBAC", "Single-user scope: no accounts, tenancy, or RBAC"], ["OCR", "图片型 PDF 显式拒绝而不是自动 OCR", "Image-only PDFs are rejected explicitly rather than silently OCR-ed"], ["自动账本保留策略", "轨迹保留是手动的，没有自动化的分级归档", "Trace retention is manual; there's no automated tiering"], ["高可用", "无多 AZ、无自动故障转移、无自动扩缩——单机部署", "No multi-AZ, no failover, no autoscaling — it's a single host"], ["实盘交易", "有意不做。MCP 只放行只读工具，交易类在白名单外", "Trading is deliberately out of scope; the allowlist blocks it at my layer"]]}], "say": "Shipped: ingestion, hybrid retrieval, the evidence gate with real refusal, structured claims with a citation critic, multi-provider model access, deterministic portfolio math, read-only brokerage integration, a three-layer cost ledger, async jobs and events, resource bounding, evals, and a bounded AWS smoke test. Partial: Kafka is a working pipeline without operational maturity, and my eval suite catches regressions but doesn't measure absolute quality. Deliberately absent: reranking, multi-user auth, OCR, and high availability — each because I'd rather name the gap than imply it's covered."}, {"id": "c4", "n": "04", "title": "Non-Functional Requirements", "tz": "非功能需求：目标、现状、差距", "lead_zh": "非功能需求（NFR）是系统设计面试的必考项。诀窍是每一项都给出「目标 / 现在做到什么 / 差在哪」三段式——不要只说目标。", "lead_en": "For every NFR, give the target, the current state, and the gap. Stating only the target reads as aspiration, not engineering.", "blocks": [{"h": "", "kind": "nfr", "items": [{"k": "正确性 Correctness", "goal": "用户可执行的数字必须可复现、可测试", "now": "全部由确定性 Python 计算，49 个测试文件覆盖；模型不参与数字生成", "gap": "金融规则本身没有第三方审核", "en": "Every actionable number is deterministic and unit-tested; the model never produces one. The gap is that the financial rules themselves haven't been externally reviewed."}, {"k": "可信度 Trustworthiness", "goal": "宁可不答，不可错答", "now": "证据门按覆盖率拒答；critic 校验引用支撑；无证据禁止生成报告", "gap": "阈值是经验值，不是标定值", "en": "The gate refuses below a coverage threshold and reports are blocked without evidence. The threshold is tuned, not calibrated against a labeled benchmark."}, {"k": "性能 Performance", "goal": "本地环节不成为瓶颈", "now": "HNSW + GIN 索引、先过滤后排序、避免重复 embedding；本地环节合计约占端到端 20%", "gap": "没有任何压测数据；无答案缓存、无 reranking 收益评估", "en": "Local work is index-backed and is a small share of end-to-end time; the external model call dominates. I have no load-test numbers, and I'd rather say that than quote a made-up p99."}, {"k": "可用性 Availability", "goal": "外部依赖挂掉时仍有可用能力", "now": "外部依赖失败显式化，本地检索与已入库文档仍可查；Kafka 失败不影响业务", "gap": "自有基础设施是单机单点，宿主机挂 = 全站挂", "en": "External failures degrade explicitly and local capability survives, but my own infrastructure is a single host with no failover."}, {"k": "一致性 Consistency", "goal": "钱和证据必须强一致，审计可最终一致", "now": "必须原子的东西都在同一个 PostgreSQL 事务里；跨系统只走幂等 + 最终一致", "gap": "跨系统对账（我的估算 vs 供应商账单）目前是手动触发", "en": "Everything that must be atomic lives in one database transaction; cross-system paths are idempotent and eventually consistent. Reconciliation against provider billing is still manual."}, {"k": "持久性 Durability", "goal": "已发生的用量和证据不能丢", "now": "用量账本只增不减、无 Run 外键；供应商账单快照作为最终事实", "gap": "数据在单机 EBS 卷上，没有自动备份与恢复演练", "en": "The usage ledger is append-only with no foreign key to a run, and provider billing snapshots are the source of truth. But the data sits on one volume with no tested backup and restore."}, {"k": "安全与隐私 Security", "goal": "私有数据不默认外发，外部内容不当指令", "now": "同意门控制公开数据调用；账本不存 prompt/持仓/密钥；MCP 严格只读白名单；检索内容只当数据", "gap": "没有多用户鉴权体系，密钥靠环境变量而非托管密钥服务", "en": "A consent gate governs external calls, the ledger stores no prompts or holdings, the MCP allowlist is read-only, and retrieved content is treated as data. There's no auth system and secrets come from environment variables, not a managed secret store."}, {"k": "成本 Cost", "goal": "每一次外部调用都可归因、可上限", "now": "路由定预算上限；账本记 token 与调用时单价快照；跨模型成本-质量基准", "gap": "没有实时预算熔断，超支只能事后看到", "en": "Routing sets per-run budgets and the ledger records tokens with a call-time price snapshot. There's no real-time circuit breaker — overspend is visible after the fact."}, {"k": "可观测性 Observability", "goal": "任何一次回答都能复盘", "now": "run / tool_calls / model_calls 全量持久化，Runs 页面可查轨迹与成本", "gap": "可观测但未被运维——没有告警，没有人收", "en": "Runs, tool calls, and model calls are all persisted and inspectable. It's observable but not operated: there's no alerting and nobody on call."}, {"k": "可维护性 Maintainability", "goal": "改一处不牵动全身", "now": "仓储层集中查询、Alembic 迁移 + drift 检查、mock 供应商让测试零成本可复现", "gap": "前端 App.tsx 约 35 万字符单文件，是当前最大维护风险", "en": "Repositories centralize queries, migrations are versioned with a drift check, and a mock provider makes tests free and reproducible. The frontend is one 350,000-character file — that's my biggest maintenance risk."}]}], "say": "I'd group them as correctness, trustworthiness, performance, availability, consistency, durability, security, cost, observability, and maintainability. For each I try to state the target, what's actually implemented, and the gap. The two I'm proudest of are trustworthiness — refusal is a real code path, not prompt wording — and cost attribution. The two biggest gaps are availability, since it's a single host with no failover, and maintainability on the frontend."}, {"id": "c5", "n": "05", "title": "Performance", "tz": "性能：时间花在哪，怎么优化，还能怎么提升", "lead_zh": "这一章最容易翻车的地方是**编数字**。我没有压测数据，所以正确策略是：讲清楚瓶颈在哪、为什么本地优化收益有限、以及真正的杠杆是什么。", "lead_en": "The trap here is inventing numbers. I have no load tests, so the honest move is to explain where the time goes and what the real lever is.", "diagram": "d5", "dgm_cap": "典型问答的时间分布。外部模型调用占绝对多数，且不在我的控制内。", "blocks": [{"h": "真正的性能杠杆 / Where the leverage actually is", "kind": "pairs", "items": [{"k": "少调模型", "zh": "确定性路由决定 Fast/Standard/Deep。简单查询不该付深度研究的代价。这比优化任何本地代码都有效。", "en": "The biggest lever isn't faster code, it's fewer model calls. Deterministic routing decides depth up front so a simple lookup doesn't pay for a deep research loop."}, {"k": "早点停", "zh": "证据门在检索后、生成前判断。证据不够就不发起昂贵的生成调用——省时间也省钱。", "en": "The gate runs after retrieval and before generation, so an unanswerable question never pays for a generation call."}, {"k": "不重复算", "zh": "content_hash 让重复上传不重新 embedding；报告生成拆成独立 Run，避免问答时顺带烧一遍报告的 token。", "en": "Content hashing avoids re-embedding, and report generation is a separate run so answering a question doesn't silently pay for a report."}, {"k": "数据库里算", "zh": "向量检索从 Python 里的余弦计算搬进 pgvector（HNSW），全文检索用 GIN 索引；过滤先于排序，避免对无关行做排序。", "en": "Vector similarity moved from Python into pgvector with HNSW, full-text uses GIN, and filters apply before ranking so we never rank rows we'll discard."}]}, {"h": "提升空间（按性价比排序）/ Improvement backlog", "kind": "rank", "items": [["高", "前端 App.tsx 按路由拆分", "不是运行时性能，是开发速度——它每周都在拖慢我", "Split the 350K-character frontend by route: not runtime performance, but it slows every change"], ["高", "答案与检索结果缓存", "相同问题 + 相同文档集应命中缓存，直接省掉最贵的那一步", "Cache retrieval and answers keyed by question plus document set — skips the most expensive step entirely"], ["中", "实时预算熔断", "当前只能事后看到超支，应该在 Run 内实时中断", "A real-time budget circuit breaker; today overspend is only visible afterwards"], ["中", "Reranking", "小候选集上做精排提升准确率，但会加延迟或模型成本——要先有 eval", "A reranker over the small candidate set, but only after evals show retrieval is the bottleneck"], ["中", "embedding 供应商冗余", "当前单一供应商，挂了就没有语义检索", "A second embedding provider; today a single vendor outage removes semantic search"], ["低", "流式输出", "模型边生成边返回，感知延迟大幅下降（真实延迟不变）", "Streaming responses — perceived latency drops sharply even though real latency doesn't"], ["低", "连接池与批量 embedding 调优", "有收益但目前不是瓶颈", "Connection pool and batch embedding tuning — real but not currently the bottleneck"]]}], "say": "End-to-end latency is dominated by the external model call — local work is index-backed and small by comparison. So the lever isn't micro-optimizing my code, it's calling the model less: deterministic routing picks the depth up front, and the evidence gate runs before generation so an unanswerable question never pays for a generation call. I should be clear that I have no load-test numbers. The highest-value improvements I'd make next are caching retrieval and answers keyed by question plus document set, and a real-time budget circuit breaker."}, {"id": "c6", "n": "06", "title": "Data Transformation", "tz": "原始输入如何一步步变成输出", "lead_zh": "「input 怎么变成 output」是系统设计的核心问题之一。关键不是背流程，而是能说出**每一步丢了什么信息、哪一步最容易出错**。", "lead_en": "The point isn't reciting the pipeline — it's knowing what each transformation loses and where it breaks.", "diagram": "d4", "dgm_cap": "八个阶段的数据形态变化，以及贯穿全程必须成立的四条不变量。", "blocks": [{"h": "每一步的信息损失 / What each step loses", "kind": "pairs", "items": [{"k": "解析 Parse", "zh": "丢版式、表格结构、图表。图片型 PDF 直接没有文本层——所以显式拒绝，不静默索引空文档。", "en": "Parsing loses layout, table structure, and figures. An image-only PDF has no text layer at all, which is why it's rejected explicitly rather than indexed as an empty document."}, {"k": "切分 Chunk", "zh": "丢跨块的上下文。用 overlap 兜底，但跨越很多页的论证仍然会被切散。", "en": "Chunking loses cross-chunk context. Overlap mitigates it, but an argument spanning many pages still gets fragmented."}, {"k": "向量化 Embed", "zh": "丢精确字面。这正是必须保留关键词检索的原因——也意味着换 embedding 模型等于让全部历史向量失效，必须整体重建。", "en": "Embedding loses literal exactness, which is exactly why lexical search stays. It also means changing the embedding model invalidates every stored vector and forces a full rebuild."}, {"k": "融合 Fuse", "zh": "丢分数强度。RRF 只用名次，因为不同检索系统的分数不在同一量纲——这是有意识的取舍。", "en": "Fusion loses score magnitude. RRF uses rank only, because scores from different retrievers aren't on a comparable scale — a deliberate trade."}, {"k": "结构化 Structure", "zh": "把散文压成可验证的断言。表达力下降，但换来了可校验性。", "en": "Structuring compresses prose into verifiable assertions — less expressive, but checkable."}]}, {"h": "输出侧的契约 / The output contract", "kind": "plain", "zh": "输出不是「模型返回的一段话」，而是一个结构化响应：数字字段、claim 列表、引用列表、证据校验结果、成本与 Run id。前端渲染的是这些字段，**不解析模型散文里的数字**。这样即使模型在文字里写错了一个数，页面上显示的仍是确定性代码算出来的值。", "en": "The output is a structured response — numeric fields, claims, citations, verification results, cost, and a run id — not a blob of prose. The frontend renders those fields and never parses numbers out of the model's text, so even if the prose drifts, the displayed number is the computed one."}], "say": "Raw file to evidence item to chunk to vector, then at query time to candidates, fused evidence, structured claims, and finally a structured response. What matters is what each step loses: parsing loses layout, chunking loses cross-chunk context, embedding loses literal exactness — which is why lexical search stays — and fusion loses score magnitude, which is why RRF uses rank position. Four invariants hold throughout: citations resolve to source and page, no actionable number passes through the model, insufficient evidence yields refusal, and re-ingesting the same file changes nothing."}, {"id": "c7", "n": "07", "title": "Technical Selection", "tz": "技术选型：选了什么，为什么，代价是什么，什么时候会换", "lead_zh": "选型题的满分答案有四段：**候选方案 → 我选了什么 → 代价是什么 → 什么条件下我会改变主意**。只说前两段是及格，说全四段是优秀。", "lead_en": "A complete selection answer has four parts: the alternatives, the choice, the cost of that choice, and the condition that would reverse it.", "blocks": [{"h": "", "kind": "sel", "items": [{"t": "向量存储 / Vector store", "alt": "专用向量库（Pinecone、Weaviate、Qdrant）vs pgvector", "pick": "PostgreSQL + pgvector", "why": "证据向量和业务事实要在同一个事务里写；partial failure 会留下「有向量没文档」的孤儿数据，那个对账负担是永久的。而且个人项目多一个系统就是多一份运维。", "cost": "大规模 + 重过滤场景下性能会不如专用库；向量与事务负载共享同一实例。", "when": "当带过滤的向量查询成为延迟瓶颈，或 embedding 写入量开始干扰事务负载时——两者都可测量。", "en": "I chose pgvector inside PostgreSQL so a chunk's vector and its document row commit in the same transaction, and so I operate one system instead of two. The cost is that a dedicated store would win at large scale with heavy filtering. I'd move when filtered vector latency becomes the bottleneck or embedding writes interfere with transactional load — both measurable."}, {"t": "检索策略 / Retrieval", "alt": "纯向量 vs 纯关键词 vs 混合", "pick": "三路混合 + 加权 RRF", "why": "语义检索对股票代码、日期、精确数字最不擅长——而这恰恰是金融问题最依赖的。问 QQQ 会召回一堆语义相近的科技 ETF，但用户问的是那一只。", "cost": "三倍查询开销，融合权重需要调，实现复杂度更高。", "when": "如果 eval 显示某一路召回几乎从不贡献有效证据，就砍掉它。", "en": "Semantic search is worst at exactly what finance queries need — tickers, dates, exact figures. Asking about QQQ returns semantically-similar tech ETFs. So I run three retrievers and fuse by rank with weighted RRF. The cost is three queries and weights to tune; I'd drop a retriever if evals showed it never contributes."}, {"t": "融合方式 / Fusion", "alt": "分数归一化相加 vs 倒数排名融合", "pick": "weighted RRF", "why": "归一化假设分数分布可比且稳定，但全文检索得分随语料统计漂移。RRF 只用名次，对此免疫。", "cost": "丢掉了分数强度信息——「非常相关」和「有点相关」在同一名次上无法区分。", "when": "如果引入 reranker，就可以在小候选集上恢复强度信息。", "en": "Score normalization assumes comparable, stable distributions, and full-text scores drift with corpus statistics. RRF uses rank only, so it's robust — at the cost of throwing away magnitude. A reranker would restore that on a small candidate set."}, {"t": "Agent 架构 / Agent topology", "alt": "单 Agent vs 多 Agent 编排", "pick": "复合 AI 系统中的单个受控循环", "why": "多 Agent 买到的是隔离上下文和并行，付出的是上下文传递、token 翻倍和难以复现的调试。我目前三者都不需要。", "cost": "单个上下文窗口要装下所有内容；未来做独立审查时会受限。", "when": "子任务需要隔离上下文、能真正并行、或需要不看前序推理的独立审查者——且 eval 证明拆分更优。", "en": "Multi-agent buys isolated context and parallelism and costs handoff, duplicated tokens, and irreproducible debugging. None of the three benefits apply yet. I'd split when a subtask needs an isolated window, can run in parallel, or needs an independent reviewer — and only if evals show the split wins."}, {"t": "异步机制 / Async", "alt": "只用 Redis vs 只用 Kafka vs 两者都用", "pick": "Redis 传命令，Kafka 传事实", "why": "语义不同：命令有唯一执行者、执行完即失效；事实有多个潜在读者、需要 offset 和回放。强行合并要么放弃回放，要么把队列变成日志。", "cost": "两套中间件的运维面；以我当前流量 Kafka 并非必需。", "when": "如果长期只有一个消费者，生产环境我会先移除 Kafka，等出现第二个独立下游再加回来。", "en": "Redis carries commands with exactly one intended executor; Kafka carries durable facts with multiple readers, offsets, and replay. Forcing one system to do both means giving up replay or turning a queue into a log. Honestly, at my traffic Kafka isn't required — I'd remove it in production and add it back when a second independent consumer appears."}, {"t": "部署形态 / Deployment", "alt": "EKS + MSK vs 单台 EC2 + Compose", "pick": "单台 EC2 + Compose（K8s 在本地 kind 验证）", "why": "目标是「在真实云环境证明应用能跑」，托管控制平面的固定月费证明不了应用层的任何事。", "cost": "没有高可用，宿主机挂 = 全站挂，需要人工重建。", "when": "出现真实用户和 SLA 时；那时先上多 AZ + RDS Multi-AZ，K8s 反而不是第一步。", "en": "The goal was proving the app runs in a real cloud environment within a small budget, and a managed control plane's fixed cost proves nothing at the application layer. The cost is no HA at all. With real users and an SLA, the first step would be multi-AZ and RDS failover — not Kubernetes."}, {"t": "数字生成 / Numbers", "alt": "模型生成（带 schema 校验）vs 确定性代码", "pick": "确定性代码，模型完全不碰", "why": "校验不等于保证——校验失败之后你还是没有正确答案。而且模型算术不可复现、无法回归测试。", "cost": "业务规则要自己写、自己维护，灵活性低于让模型自由发挥。", "when": "不会换。这是这个领域的底线。", "en": "Validation isn't a guarantee — when validation fails you still don't have the right answer, and model arithmetic can't be regression-tested. The cost is writing and maintaining the rules myself. In this domain I wouldn't reverse this one."}]}], "say": "For each choice I try to name the alternative, the reason, the cost, and the reversal condition. pgvector over a dedicated vector store, because vectors and business rows should commit together and one system is one thing to operate — I'd move when filtered vector latency becomes the bottleneck. Hybrid retrieval because semantic search is worst at tickers and dates. RRF over score fusion because scores aren't comparable across retrievers. Single agent because multi-agent's benefits don't apply yet. And deterministic numbers, which is the one I wouldn't reverse."}, {"id": "c8", "n": "08", "title": "Failure Modes", "tz": "哪些问题不可控，出问题还能不能工作", "lead_zh": "这题的高分答法是先分类：**我能控制的 / 我控制不了的**。然后对每一类给出降级行为。承认单点比假装有 HA 可信得多。", "lead_en": "Split failures into what you control and what you don't, then give the degradation behavior for each. Admitting a single point of failure beats pretending you have HA.", "diagram": "d6", "dgm_cap": "各组件失效时的影响面与剩余能力。红色是无降级路径的单点。", "blocks": [{"h": "不可控的外部风险 / Outside my control", "kind": "risk", "items": [["供应商宕机或限流", "模型 API 挂掉、429、配额耗尽", "统一 provider 接口可切换；显式报错而非静默换供应商（用户选了 Kimi 就不能偷偷用 Gemini）；失败调用也记录用量，因为它可能已经计费", "Provider outage or rate limiting: the uniform interface lets the user switch, failures surface explicitly instead of silently falling back to another vendor, and even failed calls are recorded because they may still have been billed."], ["供应商改价或下线模型", "历史成本报表会失真；模型名失效", "账本存调用时单价快照，历史成本不随今天的价格变动；模型不可用时显式失败并提示切换", "Price changes or model deprecation: the ledger stores a call-time price snapshot so historical cost never silently rewrites itself."], ["外部 schema 变更", "Robinhood MCP 工具签名变化，可能悄悄改变语义", "能力发现 + schema 指纹：指纹变了就标记连接为需复核，而不是继续按旧假设调用", "Upstream schema drift: capability discovery plus schema fingerprints mean a changed tool signature flags the connection for review instead of being called under stale assumptions."], ["外部数据质量", "行情或网页内容本身就是错的", "证据门 + critic 只能验证「引用是否支撑结论」，验证不了「来源本身是否正确」——这是真实的能力边界，我会直说", "Bad upstream data: the gate and critic verify that a citation supports a claim, not that the source is correct. That's a genuine limit and I say so."], ["模型不确定性", "同样输入不同输出", "把不确定性限制在「文字表达」上——数字和判定都由确定性代码产生；用固定题集 eval 监控回归", "Model non-determinism is confined to prose; numbers and decisions come from deterministic code, and a fixed eval set watches for regressions."], ["云宿主机 / AZ 故障", "EC2 实例或可用区不可用", "★ 当前无自动故障转移。这是单机部署的直接后果，我不会掩饰——生产要多 AZ + RDS Multi-AZ + ASG", "Host or AZ failure: there is no automatic failover today. That's the direct consequence of a single-host deployment and I'd rather state it than imply resilience I don't have."], ["用户输入质量", "图片型 PDF、脏 CSV、超大文件", "准入控制 + 显式拒绝 + 明确停止原因，不静默接受成空索引", "Poor user input is caught by admission control and explicit rejection with a specific reason, never silently indexed as empty."]]}, {"h": "我能控制的（以及怎么控的）/ Within my control", "kind": "pairs", "items": [{"k": "内存爆掉", "zh": "流式上传 → 准入控制 → 独立子进程带自己的上限 → 软阈值 → 容器硬限制。五层，最坏情况只死子进程。", "en": "Five layers: streaming upload, admission control, a child process with its own ceiling, a soft threshold, and the container's hard limit. The worst case kills the child, not the API."}, {"k": "循环失控", "zh": "轮数、超时、token 预算三个独立上限，加上「必须有进展才继续」。", "en": "Three independent bounds — iterations, wall clock, token budget — plus a progress requirement so the loop can't re-search the same gap forever."}, {"k": "重复处理", "zh": "content_hash 幂等 + 事件键去重 + 重试上限 3 次 + DLQ。", "en": "Content-hash idempotency, event-key dedupe, a three-attempt retry cap, and a dead letter queue."}, {"k": "数据模型错误", "zh": "这是我真实踩过的坑：把可删除的调试轨迹当成了财务账本。修法是三层生命周期分离 + 回归测试钉死。", "en": "The one I actually shipped: I reused a deletable trace as a financial ledger. The fix was three separate lifecycles, pinned by a regression test."}, {"k": "schema 漂移", "zh": "Alembic 迁移 + 显式 drift 检查命令 + 空库验收。", "en": "Versioned migrations, an explicit drift check, and a clean-database acceptance run."}]}, {"h": "一句话总结降级哲学 / Degradation philosophy", "kind": "plain", "zh": "外部依赖失效时，系统**降级但不撒谎**：能做的继续做，做不了的明确说不能做，绝不用「看起来像样的答案」填补空白。这条原则让每一个失败路径的正确行为都是可推导的。", "en": "When a dependency fails, the system degrades but never lies: it keeps doing what it still can, states plainly what it can't, and never fills the gap with a plausible-looking answer. That single rule makes the correct behavior of every failure path derivable."}], "say": "I'd split it into what I control and what I don't. Outside my control: provider outages, price changes, upstream schema drift, bad source data, model non-determinism, and host failure. For each there's a defined degradation — the provider interface lets the user switch and never silently falls back, the ledger stores a call-time price snapshot, schema fingerprints flag drift, and when web evidence is unavailable the gate refuses rather than answering from stale data. Within my control: memory, runaway loops, duplicate processing, and schema drift, each with layered bounds. The single point I'll name outright is that PostgreSQL and the single EC2 host have no failover — that's a consequence of the deployment I chose, not something I've solved."}, {"id": "c9", "n": "09", "title": "Infrastructure & HA", "tz": "服务跑在哪，机器挂了怎么办", "lead_zh": "这一章要能画出「现在」和「生产该有的」两张图，并说清楚从前者到后者的成本。面试官不指望个人项目有 HA，但指望你知道 HA 长什么样。", "lead_en": "Be able to draw both what you run and what production would need. Nobody expects HA on a personal project; they expect you to know what it looks like.", "diagram": "d7", "dgm_cap": "左：当前实际部署（有界冒烟）。右：真实生产的高可用形态。", "blocks": [{"h": "「机器挂了怎么办」的诚实答法 / Answering the host-failure question", "kind": "steps", "items": [{"zh": "**第一步 · 承认现状**：现在是单台 EC2，宿主机挂 = 全站不可用，需要人工用 Terraform 重建 + 从 ECR 拉同一 tag 的镜像。恢复是可复现的，但不是自动的。", "en": "Today it's a single EC2 host, so losing it means a full outage. Recovery is reproducible — Terraform plus the same pinned images from ECR — but it's manual, not automatic."}, {"zh": "**第二步 · 说清楚为什么可接受**：这是有界冒烟验收，不是生产系统。没有真实用户、没有 SLA，为一个演示项目付多 AZ 的钱是错误的取舍。", "en": "That's acceptable because this is a bounded acceptance test, not a production service — no users, no SLA. Paying for multi-AZ on a demo would be the wrong trade."}, {"zh": "**第三步 · 给出生产方案**：ALB + 跨 AZ ASG（健康检查自动摘除坏实例）、RDS Multi-AZ（同步复制自动故障转移）、ElastiCache 主从、MSK 三 broker（replication factor 3, min.insync.replicas 2）、文档与产物放 S3、蓝绿或滚动发布带自动回滚。", "en": "For production: an ALB with a multi-AZ auto-scaling group, RDS Multi-AZ for synchronous replication and automatic failover, a replicated cache, a three-broker Kafka cluster with replication factor three and min in-sync replicas of two, S3 for documents and artifacts, and blue-green deploys with automatic rollback."}, {"zh": "**第四步 · 指出最容易被忽略的一环**：无状态服务好办，**有状态的才是真问题**——数据库故障转移、迁移必须向后兼容（新旧版本会短暂共存）、Kafka 分区重平衡。而且备份没演练过恢复，等于没有备份。", "en": "The part people skip: stateless services are easy, state is the hard part. Database failover, backward-compatible migrations because old and new versions coexist during a rollout, and partition rebalancing. And a backup you've never restored isn't a backup."}]}, {"h": "当前基础设施清单 / What actually runs", "kind": "pairs", "items": [{"k": "计算 Compute", "zh": "单台 EC2，Docker Compose 编排全栈；镜像来自 ECR，tag 固定，保证本地和云上是同一份产物。", "en": "One EC2 instance running the whole stack under Compose, with pinned images from ECR so local and cloud run the identical artifact."}, {"k": "数据 Data", "zh": "容器内 PostgreSQL 16 + pgvector，数据落在 EBS 卷；Redis 开 appendonly；Kafka 用 KRaft 单节点。", "en": "Containerized PostgreSQL with pgvector on an EBS volume, Redis with append-only persistence, and a single-node Kafka in KRaft mode."}, {"k": "编排验证 Orchestration", "zh": "K8s manifests 在本地 kind 集群完整验证过，没有上托管集群——这是成本判断，不是能力上限。", "en": "Kubernetes manifests are validated end to end on a local kind cluster; I didn't move to a managed control plane, which was a cost decision."}, {"k": "资源边界 Limits", "zh": "每个服务都设了 mem_limit（Redis 512m、Kafka 1g、worker 2g、consumer 512m），健康检查 + depends_on service_healthy 保证启动顺序。", "en": "Every service has an explicit memory limit, and health checks with dependency conditions ensure correct startup ordering."}, {"k": "基础设施即代码 IaC", "zh": "Terraform 管理云资源，可一键创建与销毁——这既是可复现性，也是成本控制。", "en": "Terraform manages the cloud resources so the environment can be created and destroyed on demand — reproducibility and cost control in one."}]}], "say": "Today it runs on a single EC2 instance with Docker Compose and pinned ECR images, with Terraform managing the infrastructure. If that host dies, the service is down — recovery is reproducible but manual. I'd rather say that than imply resilience I don't have. Production would need an ALB with a multi-AZ auto-scaling group, RDS Multi-AZ, a replicated cache, a three-broker Kafka cluster, S3 for artifacts, and blue-green deploys with rollback. The part people underestimate is state: database failover, backward-compatible migrations because versions coexist during a rollout, and the fact that an unrehearsed backup isn't a backup."}, {"id": "c10", "n": "10", "title": "Consistency", "tz": "一致性如何保证", "lead_zh": "一致性题的关键是**把边界画清楚**：哪些必须强一致、哪些可以最终一致、以及为什么你不需要分布式事务。", "lead_en": "The key is drawing the boundary: what must be strongly consistent, what can be eventual, and why you don't need distributed transactions.", "diagram": "d8", "dgm_cap": "一致性边界。所有必须原子的操作都被收进同一个 PostgreSQL 事务。", "blocks": [{"h": "三类一致性 / Three consistency classes", "kind": "pairs", "items": [{"k": "强一致（单库事务）", "zh": "一次模型调用同时写「可删除的调用轨迹」和「只增的用量账本」，在同一个事务里。这样不会出现「Run 成功但账没记」的半完成状态。文档导入同理：document + evidence_items + chunks + 向量一起提交。", "en": "A model call writes both the deletable trace and the append-only usage ledger in one transaction, so there's no half state where the run succeeded but the spend wasn't recorded. Ingestion commits the document, its evidence items, chunks, and vectors together."}, {"k": "最终一致（跨系统）", "zh": "Kafka 的审计投影是异步的。消费者滞后时页面数字暂时偏旧，但业务正确性不依赖它——所以可以接受最终一致。关键规则：**发事件失败绝不能让业务失败**。", "en": "The Kafka audit projection is asynchronous, so it can lag. Business correctness doesn't depend on it, which is what makes eventual consistency acceptable — and a publish failure must never fail the run."}, {"k": "对账收敛（跨组织）", "zh": "我的成本估算 vs 供应商实际账单，靠导入账单快照对账。这里我明确区分：估算是运营遥测，账单才是事实来源。", "en": "My cost estimate versus the provider's actual bill converges through imported billing snapshots. I keep the labels distinct: my number is operational telemetry, theirs is the source of truth."}]}, {"h": "为什么不需要分布式事务 / Why no 2PC or Saga", "kind": "plain", "zh": "因为我把「必须原子」的东西全部收进了同一个 PostgreSQL。Redis 里只有可重建的任务状态（丢了重新入队即可），Kafka 里只有可重放的事实（丢了从 offset 重读）。这不是运气，是设计时刻意画的边界——与其引入 Saga 补偿逻辑和它带来的一整类新 bug，不如先让事务边界落在一个数据库里。这个答案比「我用了 Saga 模式」更能体现判断力，因为它说明你知道分布式事务的代价。", "en": "Because everything that must be atomic lives in one PostgreSQL database. Redis holds only reconstructible job state and Kafka only replayable facts. That wasn't luck — it was a deliberate boundary. Rather than take on saga compensation logic and the whole class of bugs it brings, I kept the transaction boundary inside one database. I'd introduce distributed coordination when a genuine second write-authority appears, not before."}, {"h": "幂等：exactly-once 是构造出来的 / Idempotency", "kind": "pairs", "items": [{"k": "上传", "zh": "content_hash 作为稳定键。重复点击上传不产生重复证据，也不重复付 embedding 的钱。", "en": "Ingestion keys on a content hash, so a double-click doesn't duplicate evidence or re-spend the embedding budget."}, {"k": "消费", "zh": "Kafka 是 at-least-once（不是 exactly-once）。消费者重启可能在提交 offset 前重放已处理的批次，所以投影前必须按事件键去重。", "en": "Kafka is at-least-once. A consumer restarting before committing its offset will reprocess a batch, so the consumer dedupes on an event key before projecting."}, {"k": "重试", "zh": "上限 3 次，超过进 DLQ。一条毒消息卡住分区会让它后面所有消息全部停摆——这是必须隔离的。", "en": "Retries cap at three, then the message goes to a dead letter queue, because one poison message blocking a partition stalls everything behind it."}, {"k": "结论", "zh": "「恰好一次」不是消息系统送给你的保证，是你在消费端用幂等键构造出来的。", "en": "Exactly-once isn't a guarantee the messaging system hands you — it's something you construct at the consumer with an idempotency key."}]}, {"h": "时间维度的一致性 / Temporal consistency", "kind": "plain", "zh": "还有一类容易被忽略的一致性：**时间**。回答「2026 年 3 月的判断」时不能使用 5 月才发布的资料，否则评估结果是自欺欺人。所以检索支持 as_of_date 过滤，而且**必须在排序之前过滤**——否则名次已经被未来数据污染了。同理，成本账本存调用时的单价快照，保证历史成本报表在任何时候查都给出同一个答案。", "en": "There's a temporal dimension people forget. Answering a question as of March mustn't use material published in May, so retrieval supports an as-of-date filter — and it has to filter before ranking, otherwise the ranking is already contaminated. The same idea drives the call-time price snapshot in the cost ledger: a historical cost report gives the same answer whenever you run it."}], "say": "I split it into three classes. Strongly consistent: anything that must be atomic lives in one PostgreSQL transaction — a model call writes its trace and its usage ledger row together, so there's no state where the run succeeded but the spend went unrecorded. Eventually consistent: the Kafka audit projection, where a publish failure must never fail the business operation. And reconciliation: my cost estimate converges to the provider's bill through imported snapshots, with the labels kept distinct. I don't need distributed transactions because I deliberately kept the write authority in one database. On duplicates, Kafka is at-least-once, so exactly-once is something I construct at the consumer with an idempotency key."}, {"id": "c11", "n": "11", "title": "Input / Output Stability", "tz": "如何保证输入和输出是稳定的", "lead_zh": "「稳定」在这里有两层意思：**输入不会把系统搞坏**，**输出不会随机变化**。分开讲，逻辑最清楚。", "lead_en": "Stability means two things: bad input can't break the system, and good input doesn't produce randomly varying output. Treat them separately.", "blocks": [{"h": "输入侧：把不可信的东西挡在边界 / Untrusted input at the boundary", "kind": "pairs", "items": [{"k": "HTTP 请求", "zh": "Pydantic 在路由层完成类型、必填、范围校验，不合法直接 422。脏数据永远进不到业务逻辑里。", "en": "Pydantic validates type, presence, and range at the route layer, so malformed input is rejected with a 422 and never reaches business logic."}, {"k": "上传文件", "zh": "准入控制先查大小与类型，再决定要不要解析；文件名的 Unicode 处理曾经出过 bug，现在被专门处理。", "en": "Admission control checks size and type before any parsing begins. Unicode filenames were an actual bug I hit, so they're handled explicitly now."}, {"k": "模型输出", "zh": "**模型的输出也是不可信输入**。工具参数要校验，结构化响应要按 schema 解析，不符合就拒绝而不是尽力猜。", "en": "Model output is untrusted input too. Tool arguments are validated and structured responses are parsed against a schema — a mismatch is rejected rather than best-guessed."}, {"k": "检索到的内容", "zh": "网页和上传文档里可能藏「忽略之前的指令」。检索内容一律当**数据**，不当指令；eval 里有专门的注入用例。", "en": "Retrieved web pages and uploaded documents can contain injected instructions, so retrieved content is always treated as data, never as instructions — and there's a dedicated eval case for it."}, {"k": "外部工具 schema", "zh": "MCP 服务端可能改工具签名。用能力发现 + schema 指纹检测变化，变了就标记待复核而不是继续按旧假设调。", "en": "An MCP server can change its tool signatures, so capability discovery plus schema fingerprints flag drift instead of calling under stale assumptions."}]}, {"h": "输出侧：让结果可复现 / Reproducible output", "kind": "pairs", "items": [{"k": "数字由代码算", "zh": "最根本的一条。确定性 Python 产出所有可执行数字，模型只写解释——输出的数值部分天然稳定。", "en": "The foundation: deterministic Python produces every actionable number and the model only writes prose, so the numeric part of the output is stable by construction."}, {"k": "前端不解析散文", "zh": "页面渲染的是结构化字段，不是从模型文字里抠数字。即使模型文字漂了，显示的仍是算出来的值。", "en": "The frontend renders structured fields rather than parsing numbers out of prose, so even if the wording drifts the displayed number is the computed one."}, {"k": "Mock 供应商", "zh": "一个 20KB 的确定性假模型，让测试完全零成本、可复现。没有它，任何依赖模型的测试都是抖的。", "en": "A deterministic mock provider makes model-dependent tests free and reproducible; without it every such test is flaky."}, {"k": "评测做回归闸门", "zh": "固定题集衡量引用支撑率、拒答正确性、注入抵抗力。它不能证明「更好」，但能证明「没变差」。", "en": "A fixed eval set measures citation support, refusal correctness, and injection resistance. It can't prove better, but it can prove not worse."}, {"k": "拒答代替猜测", "zh": "输出稳定性的一部分是「不确定时不输出」。宁可给一个明确的拒答，也不给一个每次都不一样的猜测。", "en": "Part of output stability is not producing output when you shouldn't: an explicit refusal beats a guess that differs every time."}, {"k": "停止原因显式化", "zh": "失败也要稳定——超时、超预算、供应商限流、内存超限各有明确原因，用户能据此采取不同行动。", "en": "Failures are stable too: timeout, budget exhausted, provider rate limit, and memory limit are distinct reasons because they call for different user actions."}]}, {"h": "一句话 / One line", "kind": "plain", "zh": "稳定性不是「让模型更听话」，而是**把不确定性关进一个明确的盒子里**——盒子外面（数字、判定、失败原因）全部确定性，盒子里面（自然语言表达）允许变化。", "en": "Stability isn't about making the model more obedient — it's about confining non-determinism to one clearly bounded place. Outside that box, numbers, decisions, and failure reasons are deterministic; inside it, only the wording is allowed to vary."}], "say": "On the input side, everything untrusted is validated at a boundary: Pydantic for HTTP, admission control for uploads, schema validation for tool arguments — because model output is untrusted input too — and retrieved content is treated as data, never as instructions. On the output side, determinism comes from architecture rather than prompting: the numbers are computed by tested Python, the frontend renders structured fields instead of parsing prose, a mock provider makes tests reproducible, and a fixed eval set acts as a regression gate. The one-line version is that I confine non-determinism to the wording, and keep numbers, decisions, and failure reasons deterministic."}, {"id": "c12", "n": "12", "title": "Improvement Roadmap", "tz": "提升空间：如果继续做，先做什么", "lead_zh": "面试官问「还能怎么改进」，其实是在问**你的优先级排序能力**。按「影响 × 成本」排，并说清楚为什么第一名是第一名。", "lead_en": "This question is really about prioritization. Rank by impact over effort and explain why the top item is first.", "blocks": [{"h": "", "kind": "road", "items": [["P0", "拆分前端 App.tsx", "约 35 万字符单文件，是当前唯一每周都在拖慢我的问题。按路由拆，用类型检查器当安全网，增量做而不是重写。", "Impact 高 · Effort 中", "Split the 350K-character frontend by route, incrementally, using the type checker as the safety net. It's the only item that costs me every single week."], ["P0", "真实备份与恢复演练", "数据在单机卷上，没演练过恢复等于没有备份。这是最便宜的风险消除。", "Impact 高 · Effort 低", "Set up and actually rehearse backup and restore. Data sits on one volume, and an unrehearsed backup isn't a backup — cheapest risk removal available."], ["P1", "检索与答案缓存", "相同问题 + 相同文档集直接命中缓存，跳过最贵的模型调用。对延迟和成本同时有效。", "Impact 高 · Effort 中", "Cache retrieval results and answers keyed by question plus document set — it skips the most expensive step and helps latency and cost at once."], ["P1", "实时预算熔断", "当前超支只能事后在 Runs 页面看到，应该在 Run 内实时中断并给出明确停止原因。", "Impact 中 · Effort 低", "A real-time budget circuit breaker that aborts mid-run with an explicit stop reason, instead of surfacing overspend after the fact."], ["P1", "扩充 eval 题集", "目前题集小、期望答案我自己写。要能衡量绝对质量，需要更多样本和更独立的标注。", "Impact 高 · Effort 高", "Grow the eval set with more samples and less self-authored labeling, so it measures absolute quality rather than only catching regressions."], ["P2", "embedding 供应商冗余", "当前单一供应商，挂了就没有语义检索。注意：换模型意味着全量重建向量，要设计好迁移路径。", "Impact 中 · Effort 中", "Add a second embedding provider. The catch is that switching models invalidates every stored vector, so it needs a rebuild path designed up front."], ["P2", "Reranking", "小候选集精排能提准确率，但加延迟或模型成本。先用 eval 证明检索是瓶颈再做。", "Impact 中 · Effort 中", "Add a reranker over the candidate set — but only after evals show retrieval is actually the bottleneck."], ["P2", "流式输出", "感知延迟大幅下降。真实延迟不变，但用户体验差别很大。", "Impact 中 · Effort 中", "Stream the model response. Real latency is unchanged but perceived latency drops a lot."], ["P3", "Kafka 运维成熟度", "lag 告警 + 回放演练 + 第二个消费者。或者相反——如果长期只有一个消费者，就该移除它。", "Impact 低 · Effort 中", "Either mature the Kafka path with lag alerting and a rehearsed replay, or remove it — one consumer doesn't justify the operational surface."], ["P3", "多用户与鉴权", "当前单用户假设。要做多租户就要重新审视所有数据边界，是一次架构级改动。", "Impact 低（当前）· Effort 高", "Multi-user auth and tenancy, which would mean revisiting every data boundary — an architectural change, not a feature."]]}, {"h": "怎么讲优先级 / How to justify the ranking", "kind": "plain", "zh": "排序理由要能一句话说清：**前两项是「现在就在伤害我」，中间几项是「用户会先感知到」，最后几项是「有真实用户之后才值得付」**。能说出这条分层逻辑，比列一个长清单有说服力得多。", "en": "The ranking logic in one line: the top items are what hurts me today, the middle is what a user would notice first, and the bottom is what only becomes worth paying for once there are real users. Being able to state that logic matters more than the length of the list."}], "say": "I'd rank by what hurts today versus what a user would notice versus what only matters at scale. Top of the list is splitting the frontend — it's the only thing that slows me down every week — and actually rehearsing backup and restore, since an unrehearsed backup isn't a backup. Next is caching retrieval and answers, which helps latency and cost together, and a real-time budget circuit breaker. Then growing the eval set so it measures absolute quality rather than only catching regressions. Things like multi-user auth I'd deliberately defer, because tenancy means revisiting every data boundary and there's no user demanding it yet."}], "diagrams": {"d1": "<svg class=\"dgm\" viewBox=\"0 0 1040 752\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Argus high-level architecture\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--line2)\"/></marker></defs><rect x=\"20\" y=\"10\" width=\"1000\" height=\"76\" rx=\"12\" fill=\"var(--bg3)\" stroke=\"var(--ac)\" stroke-width=\"1.2\" opacity=\"0.75\" stroke-dasharray=\"5 4\"/><text x=\"32\" y=\"27\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--ac)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">① CLIENT / 客户端</text><text x=\"1008\" y=\"27\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.5\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"end\" opacity=\"1\">React 18 + TypeScript + Vite</text><rect x=\"32\" y=\"34\" width=\"184\" height=\"44\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M33 45 a10 10 0 0 1 10 -10 h0 v42 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac)\"/><text x=\"46\" y=\"54\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">Research</text><text x=\"46\" y=\"69\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">上传·提问·引用</text><rect x=\"228\" y=\"34\" width=\"184\" height=\"44\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M229 45 a10 10 0 0 1 10 -10 h0 v42 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac)\"/><text x=\"242\" y=\"54\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">Profile</text><text x=\"242\" y=\"69\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">画像·约束</text><rect x=\"424\" y=\"34\" width=\"184\" height=\"44\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M425 45 a10 10 0 0 1 10 -10 h0 v42 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac)\"/><text x=\"438\" y=\"54\" ">→ weighted RRF 融合 → 去重 → as_of_date 过滤</text><line x1=\"520\" y1=\"274\" x2=\"520\" y2=\"284\" stroke=\"var(--line2)\" stroke-width=\"1.4\" opacity=\"1\" marker-end=\"url(#ah)\"/><rect x=\"20\" y=\"284\" width=\"1000\" height=\"44\" rx=\"9\" fill=\"var(--bg2)\" stroke=\"var(--ac5)\" stroke-width=\"1.4\" opacity=\"1\"/><circle cx=\"46\" cy=\"306.0\" r=\"14\" fill=\"var(--ac5)\"/><text x=\"46\" y=\"310.5\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12.5\" fill=\"var(--bg)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">6</text><text x=\"74\" y=\"303\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">Evidence Gate</text><text x=\"330\" y=\"301\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">覆盖率 = 已填槽位 / 必需槽位</text><text x=\"330\" y=\"316\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">不足 → 停止，返回拒答，禁止生成报告</text><line x1=\"520\" y1=\"328\" x2=\"520\" y2=\"338\" stroke=\"var(--line2)\" stroke-width=\"1.4\" opacity=\"1\" marker-end=\"url(#ah)\"/><rect x=\"20\" y=\"338\" width=\"1000\" height=\"44\" rx=\"9\" fill=\"var(--bg2)\" stroke=\"var(--ac4)\" stroke-width=\"1.4\" opacity=\"1\"/><circle cx=\"46\" cy=\"360.0\" r=\"14\" fill=\"var(--ac4)\"/><text x=\"46\" y=\"364.5\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12.5\" fill=\"var(--bg)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">7</text><text x=\"74\" y=\"357\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">Deterministic compute</text><text x=\"330\" y=\"355\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">配置比例、调仓金额、股数、缺口</text><text x=\"330\" y=\"370\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">模型拿不到这一步的写权限</text><line x1=\"520\" y1=\"382\" x2=\"520\" y2=\"392\" stroke=\"var(--line2)\" stroke-width=\"1.4\" opacity=\"1\" marker-end=\"url(#ah)\"/><rect x=\"20\" y=\"392\" width=\"1000\" height=\"44\" rx=\"9\" fill=\"var(--bg2)\" stroke=\"var(--ac5)\" stroke-width=\"1.4\" opacity=\"1\"/><circle cx=\"46\" cy=\"414.0\" r=\"14\" fill=\"var(--ac5)\"/><text x=\"46\" y=\"418.5\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12.5\" fill=\"var(--bg)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">8</text><text x=\"74\" y=\"411\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">Model call</text><text x=\"330\" y=\"409\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">只做一件事：把已验证证据写成解释</text><text x=\"330\" y=\"424\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">结构化输出，不产出数字</text><line x1=\"520\" y1=\"436\" x2=\"520\" y2=\"446\" stroke=\"var(--line2)\" stroke-width=\"1.4\" opacity=\"1\" marker-end=\"url(#ah)\"/><rect x=\"20\" y=\"446\" width=\"1000\" height=\"44\" rx=\"9\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.4\" opacity=\"1\"/><circle cx=\"46\" cy=\"468.0\" r=\"14\" fill=\"var(--ac2)\"/><text x=\"46\" y=\"472.5\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12.5\" fill=\"var(--bg)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">9</text><text x=\"74\" y=\"465\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">Critic + Claims</text><text x=\"330\" y=\"463\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">每条 claim ↔ evidence id，关系 supports/contradicts</text><text x=\"330\" y=\"478\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">引用不支撑 → 降级或剔除</text><line x1=\"520\" y1=\"490\" x2=\"520\" y2=\"500\" stroke=\"var(--line2)\" stroke-width=\"1.4\" opacity=\"1\" marker-end=\"url(#ah)\"/><rect x=\"20\" y=\"500\" width=\"1000\" height=\"44\" rx=\"9\" fill=\"var(--bg2)\" stroke=\"var(--ac)\" stroke-width=\"1.4\" opacity=\"1\"/><circle cx=\"46\" cy=\"522.0\" r=\"14\" fill=\"var(--ac)\"/><text x=\"46\" y=\"526.5\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12.5\" fill=\"var(--bg)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">10</text><text x=\"74\" y=\"519\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">Persist + publish</text><text x=\"330\" y=\"517\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">run / tool_calls / model_calls + Usage Ledger（同一事务）</text><text x=\"330\" y=\"532\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">→ Kafka 发终态事件</text><text x=\"20\" y=\"568\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">关键：③④ 决定花多少钱，⑥ 决定要不要答，⑦ 决定数字对不对，⑨ 决定引用可不可信。这四个点是面试深挖高发区。</text></svg>", "d3": "<svg class=\"dgm\" viewBox=\"0 0 1040 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Async ingestion path\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--line2)\"/></marker></defs><rect x=\"30\" y=\"22\" width=\"190\" height=\"56\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M31 33 a10 10 0 0 1 10 -10 h0 v54 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac)\"/><text x=\"44\" y=\"40\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.2\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">Browser upload</text><text x=\"44\" y=\"54\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">multipart，流式落盘</text><text x=\"44\" y=\"68\" font-family=\"ui-monospace,Menlo,Consolas,monospace\" font-size=\"10.2\" fill=\"var(--ac)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">不在内存缓冲整个文件</text><rect x=\"260\" y=\"22\" width=\"190\" height=\"56\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M261 33 a10 10 0 0 1 10 -10 h0 v54 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac2)\"/><text x=\"274\" y=\"40\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.2\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">API: admission</text><text x=\"274\" y=\"54\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">大小/类型/配额准入</text><text x=\"274\" y=\"68\" font-family=\"ui-monospace,Menlo,Consolas,monospace\" font-size=\"10.2\" fill=\"var(--ac2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">拒绝早于解析</text><rect x=\"490\" y=\"22\" width=\"190\" height=\"56\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M491 33 a10 10 0 0 1 10 -10 h0 v54 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac)\"/><text x=\"504\" y=\"40\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.2\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">Redis enqueue</text><text x=\"504\" y=\"54\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">job_id 立即返回</text><text x=\"504\" y=\"68\" font-family=\"ui-monospace,Menlo,Consolas,monospace\" font-size=\"10.2\" fill=\"var(--ac)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">HTTP 不等待解析</text><rect x=\"720\" y=\"22\" width=\"290\" height=\"56\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac3)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M721 33 a10 10 0 0 1 10 -10 h0 v54 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac3)\"/><text x=\"734\" y=\"42\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">worker.py 出队</text><text x=\"734\" y=\"57\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">状态 PENDING → RUNNING</text><line x1=\"220\" y1=\"52\" x2=\"258\" y2=\"52\" stroke=\"var(--line2)\" stroke-width=\"1.6\" opacity=\"1\" marker-end=\"url(#ah)\"/><line x1=\"450\" y1=\"52\" x2=\"488\" y2=\"52\" stroke=\"var(--line2)\" stroke-width=\"1.6\" opacity=\"1\" marker-end=\"url(#ah)\"/><line x1=\"680\" y1=\"52\" x2=\"718\" y2=\"52\" stroke=\"var(--line2)\" stroke-width=\"1.6\" opacity=\"1\" marker-end=\"url(#ah)\"/><path d=\"M865 78 L865 100\" fill=\"none\" stroke=\"var(--line2)\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"600\" y=\"102\" width=\"410\" height=\"60\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac5)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M601 113 a10 10 0 0 1 10 -10 h0 v58 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac5)\"/><text x=\"614\" y=\"120\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.2\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">extract_worker.py — 独立子进程</text><text x=\"614\" y=\"134\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">自带内存/时间上限；被 OOM 杀掉只死子进程，API 不受影响</text><text x=\"614\" y=\"148\" font-family=\"ui-monospace,Menlo,Consolas,monospace\" font-size=\"10.2\" fill=\"var(--ac5)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">软阈值先于容器硬限制触发，才能告诉用户「为什么停」</text><path d=\"M805 162 L805 184 L620 184 L620 202\" fill=\"none\" stroke=\"var(--line2)\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"430\" y=\"204\" width=\"380\" height=\"56\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M431 215 a10 10 0 0 1 10 -10 h0 v54 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac2)\"/><text x=\"444\" y=\"224\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">chunk + overlap → embedding</text><text x=\"444\" y=\"239\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">content_hash 幂等：同一文件重传不重复导入、不重复付费</text><path d=\"M430 232 L300 232\" fill=\"none\" stroke=\"var(--line2)\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"60\" y=\"204\" width=\"360\" height=\"56\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M61 215 a10 10 0 0 1 10 -10 h0 v54 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac)\"/><text x=\"74\" y=\"222\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.2\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">PostgreSQL 落库</text><text x=\"74\" y=\"236\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">documents / evidence_items / chunks + 向量</text><text x=\"74\" y=\"250\" font-family=\"ui-monospace,Menlo,Consolas,monospace\" font-size=\"10.2\" fill=\"var(--ac)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">HNSW + GIN 建索引</text><path d=\"M240 260 L240 282\" fill=\"none\" stroke=\"var(--line2)\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"60\" y=\"284\" width=\"360\" height=\"34\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac3)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M61 295 a10 10 0 0 1 10 -10 h0 v32 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac3)\"/><text x=\"74\" y=\"305.5\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">job 状态 → COMPLETE / FAILED（前端轮询）</text><text x=\"440\" y=\"292\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">失败必须显式：image-only PDF 直接拒绝并说明需要 OCR——</text><text x=\"440\" y=\"308\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">「上传成功」和「解析成功」是两个状态，静默索引空文档是最危险的失败。</text></svg>", "d4": "<svg class=\"dgm\" viewBox=\"0 0 1040 420\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Data transformation: raw input to answer\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--line2)\"/></marker></defs><rect x=\"22\" y=\"40\" width=\"114\" height=\"128\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac5)\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"79.0\" y=\"62\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--ac5)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">RAW</text><text x=\"79.0\" y= 2=\"526\" y2=\"104\" stroke=\"var(--line2)\" stroke-width=\"1.5\" opacity=\"1\" marker-end=\"url(#ah)\"/><rect x=\"526\" y=\"40\" width=\"114\" height=\"128\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"583.0\" y=\"62\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--ac2)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">CANDIDATE</text><text x=\"583.0\" y=\"84\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">3 路召回结果</text><text x=\"583.0\" y=\"99\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">精确 / 全文 / 语义</text><text x=\"583.0\" y=\"114\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">各自一份排名</text><line x1=\"640\" y1=\"104\" x2=\"652\" y2=\"104\" stroke=\"var(--line2)\" stroke-width=\"1.5\" opacity=\"1\" marker-end=\"url(#ah)\"/><rect x=\"652\" y=\"40\" width=\"114\" height=\"128\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac)\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"709.0\" y=\"62\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--ac)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">EVIDENCE</text><text x=\"709.0\" y=\"84\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">RRF 融合 + 去重</text><text x=\"709.0\" y=\"99\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">+ as_of_date 过滤</text><text x=\"709.0\" y=\"114\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">→ 通过证据门的证据集</text><line x1=\"766\" y1=\"104\" x2=\"778\" y2=\"104\" stroke=\"var(--line2)\" stroke-width=\"1.5\" opacity=\"1\" marker-end=\"url(#ah)\"/><rect x=\"778\" y=\"40\" width=\"114\" height=\"128\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac4)\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"835.0\" y=\"62\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--ac4)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">CLAIM</text><text x=\"835.0\" y=\"84\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">结构化 claim</text><text x=\"835.0\" y=\"99\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">每条挂 evidence id</text><text x=\"835.0\" y=\"114\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">supports / contradicts</text><line x1=\"892\" y1=\"104\" x2=\"904\" y2=\"104\" stroke=\"var(--line2)\" stroke-width=\"1.5\" opacity=\"1\" marker-end=\"url(#ah)\"/><rect x=\"904\" y=\"40\" width=\"114\" height=\"128\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac4)\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"
