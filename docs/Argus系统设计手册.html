-ui,sans-serif\" font-size=\"11\" fill=\"var(--ac)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">向量化</text><text x=\"394\" y=\"205\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">文字 → 数字</text><text x=\"520\" y=\"190\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11\" fill=\"var(--ac)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">召回</text><text x=\"520\" y=\"205\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">问题 → 候选</text><text x=\"646\" y=\"190\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11\" fill=\"var(--ac)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">融合</text><text x=\"646\" y=\"205\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">多份排名 → 一份证据</text><text x=\"772\" y=\"190\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11\" fill=\"var(--ac)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">结构化</text><text x=\"772\" y=\"205\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">散文 → 可验证断言</text><text x=\"898\" y=\"190\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11\" fill=\"var(--ac)\" font-weight=\"700\" text-anchor=\"middle\" opacity=\"1\">呈现</text><text x=\"898\" y=\"205\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"middle\" opacity=\"1\">断言 → 用户可执行</text><rect x=\"22\" y=\"226\" width=\"996\" height=\"76\" rx=\"10\" fill=\"var(--bg3)\" stroke=\"var(--ac5)\" stroke-width=\"1.3\" opacity=\"1\"/><text x=\"40\" y=\"249\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12.5\" fill=\"var(--ac5)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">每一步都可能丢信息 —— 面试常问「哪一步最容易出错」</text><text x=\"40\" y=\"270\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">解析：image-only PDF 无文本层 → 显式拒绝而不是索引空文档   ·   切分：关键句被切断 → 用 overlap 兜底</text><text x=\"40\" y=\"288\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">向量化：换模型 = 全部向量失效，必须重建   ·   融合：分数量纲不同 → 用 RRF 按名次而不是加权求和</text><rect x=\"22\" y=\"314\" width=\"996\" height=\"84\" rx=\"10\" fill=\"var(--bg3)\" stroke=\"var(--ac2)\" stroke-width=\"1.3\" opacity=\"1\"/><text x=\"40\" y=\"337\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12.5\" fill=\"var(--ac2)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">不变量 / Invariants —— 无论走哪条路径都必须成立</text><text x=\"40\" y=\"358\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">① 每条 citation 必须能回溯到 source + page  ② 任何用户可执行的数字都不经过模型</text><text x=\"40\" y=\"376\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">③ 证据不足时输出必须是拒答，不是低置信度的答案  ④ 同一文件重复导入不改变系统状态（幂等）</text></svg>", "d5": "<svg class=\"dgm\" viewBox=\"0 0 1040 350\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Latency budget\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--line2)\"/></marker></defs><text x=\"24\" y=\"26\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">一次问答的时间花在哪里（按典型占比）</text><text x=\"24\" y=\"46\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">结论：优化本地代码收益很小，真正的杠杆是「要不要调模型、调几次、调哪个」——这就是路由和证据门存在的原因。</text><text x=\"24\" y=\"83\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12\" fill=\"var(--tx)\" font-weight=\"600\" text-anchor=\"start\" opacity=\"1\">Pydantic 校验 + 路由</text><rect x=\"250\" y=\"68\" width=\"448\" height=\"22\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><rect x=\"250\" y=\"68\" width=\"10\" height=\"22\" rx=\"6\" fill=\"var(--ac2)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><text x=\"710\" y=\"83\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--ac2)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">&lt; 5ms</text><text x=\"790\" y=\"83\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.3\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">纯 CPU</text><text x=\"24\" y=\"115\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12\" fill=\"var(--tx)\" font-weight=\"600\" text-anchor=\"start\" opacity=\"1\">Hybrid 检索（3 路 + RRF）</text><rect x=\"250\" y=\"100\" width=\"448\" height=\"22\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><rect x=\"250\" y=\"100\" width=\"26.88\" height=\"22\" rx=\"6\" fill=\"var(--ac2)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><text x=\"710\" y=\"115\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--ac2)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">~50–150ms</text><text x=\"790\" y=\"115\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.3\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">HNSW + GIN 索引；未加索引时是全表扫描</text><text x=\"24\" y=\"147\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12\" fill=\"var(--tx)\" font-weight=\"600\" text-anchor=\"start\" opacity=\"1\">证据门 + claim 组装</text><rect x=\"250\" y=\"132\" width=\"448\" height=\"22\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><rect x=\"250\" y=\"132\" width=\"10\" height=\"22\" rx=\"6\" fill=\"var(--ac3)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><text x=\"710\" y=\"147\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--ac3)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">~10–30ms</text><text x=\"790\" y=\"147\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.3\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">纯规则</text> pple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12\" fill=\"var(--tx)\" font-weight=\"600\" text-anchor=\"start\" opacity=\"1\">落库 + 发事件</text><rect x=\"250\" y=\"228\" width=\"448\" height=\"22\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><rect x=\"250\" y=\"228\" width=\"17.92\" height=\"22\" rx=\"6\" fill=\"var(--ac)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><text x=\"710\" y=\"243\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--ac)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">~20–50ms</text><text x=\"790\" y=\"243\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.3\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">同一事务写 trace + ledger</text><rect x=\"24\" y=\"268\" width=\"992\" height=\"74\" rx=\"10\" fill=\"var(--bg3)\" stroke=\"var(--ac3)\" stroke-width=\"1.3\" opacity=\"1\"/><text x=\"40\" y=\"291\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12\" fill=\"var(--ac3)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">已做的优化 / Done</text><text x=\"40\" y=\"310\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.8\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">HNSW 向量索引 · GIN 全文索引 · 先过滤后排序 · content_hash 避免重复 embedding · 报告生成独立 Run（不重复烧 token）· Fast/Standard/Deep 路由</text><text x=\"40\" y=\"328\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"10.8\" fill=\"var(--ac5)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">未做 / Not done：reranking、答案缓存、连接池调优、任何压测数据 —— 这些要诚实说「没测过」，别编数字。</text></svg>", "d6": "<svg class=\"dgm\" viewBox=\"0 0 1040 508\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Failure blast radius\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--line2)\"/></marker></defs><text x=\"24\" y=\"24\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">组件挂掉时，系统还剩下什么能力（Blast radius &amp; graceful degradation）</text><text x=\"30\" y=\"58\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11\" fill=\"var(--tx3)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">组件</text><text x=\"180\" y=\"58\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11\" fill=\"var(--tx3)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">归属</text><text x=\"250\" y=\"58\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11\" fill=\"var(--tx3)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">直接影响</text><text x=\"400\" y=\"58\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11\" fill=\"var(--tx3)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">剩余能力 / 降级行为</text><text x=\"1010\" y=\"58\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11\" fill=\"var(--tx3)\" font-weight=\"700\" text-anchor=\"end\" opacity=\"1\">影响面</text><rect x=\"24\" y=\"68\" width=\"992\" height=\"38\" rx=\"8\" fill=\"var(--bg2)\" stroke=\"var(--ac3)\" stroke-width=\"1.2\" opacity=\"1\"/><text x=\"36\" y=\"91\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans- inkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">证据门判定不足 → 拒答，而不是用旧数据硬答</text><rect x=\"930\" y=\"125\" width=\"78\" height=\"12\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><rect x=\"930\" y=\"125\" width=\"39.0\" height=\"12\" rx=\"6\" fill=\"var(--ac3)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><rect x=\"24\" y=\"156\" width=\"992\" height=\"38\" rx=\"8\" fill=\"var(--bg2)\" stroke=\"var(--ac3)\" stroke-width=\"1.2\" opacity=\"1\"/><text x=\"36\" y=\"179\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">Robinhood MCP</text><text x=\"180\" y=\"179\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11\" fill=\"var(--tx3)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">外部</text><text x=\"250\" y=\"179\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--ac3)\" font-weight=\"600\" text-anchor=\"start\" opacity=\"1\">实时持仓不可用</text><text x=\"400\" y=\"179\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">回退到用户上传的 CSV 持仓；标记数据新鲜度</text><rect x=\"930\" y=\"169\" width=\"78\" height=\"12\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><rect x=\"930\" y=\"169\" width=\"35.1\" height=\"12\" rx=\"6\" fill=\"var(--ac3)\" stroke=\"none\" stroke-width=\"0\" opacity=\"1\"/><rect x=\"24\" y=\"200\" width=\"992\" height=\"38\" rx=\"8\" fill=\"var(--bg2)\" stroke=\"var(--ac3)\" stroke-width=\"1.2\" opacity=\"1\"/><text x=\"36\" y=\"223\" font-fam 1\">健康检查摘除坏实例，自动补新实例</text><rect x=\"548\" y=\"132\" width=\"456\" height=\"40\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M549 143 a10 10 0 0 1 10 -10 h0 v38 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac2)\"/><text x=\"562\" y=\"152\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">RDS Multi-AZ</text><text x=\"562\" y=\"167\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">同步复制 + 自动故障转移，只读副本分担查询</text><rect x=\"548\" y=\"180\" width=\"456\" height=\"40\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M549 191 a10 10 0 0 1 10 -10 h0 v38 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac2)\"/><text x=\"562\" y=\"200\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">ElastiCache 多节点</text><text x=\"562\" y=\"215\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">Redis 主从 + 自动故障转移</text><rect x=\"548\" y=\"228\" width=\"456\" height=\"40\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M549 239 a10 10 0 0 1 10 -10 h0 v38 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac2)\"/><text x=\"562\" y=\"248\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">MSK 3 broker</text><text x=\"562\" y=\"263\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">replication factor 3, min.insync.replicas 2</text><rect x=\"548\" y=\"276\" width=\"456\" height=\"40\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M549 287 a10 10 0 0 1 10 -10 h0 v38 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac2)\"/><text x=\"562\" y=\"296\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">S3 存文档与产物</text><text x=\"562\" y=\"311\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">对象存储天然多副本，替代本地卷</text><rect x=\"548\" y=\"324\" width=\"456\" height=\"40\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M549 335 a10 10 0 0 1 10 -10 h0 v38 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac2)\"/><text x=\"562\" y=\"344\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">蓝绿 / 滚动发布</text><text x=\"562\" y=\"359\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">带自动回滚；迁移必须向后兼容</text><rect x=\"548\" y=\"372\" width=\"456\" height=\"40\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M549 383 a10 10 0 0 1 10 -10 h0 v38 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac2)\"/><text x=\"562\" y=\"392\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">告警 + on-call</text><text x=\"562\" y=\"407\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.5\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">lag、错误率、p99、成本异常都要有人收</text><text x=\"550\" y=\"434\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--ac2)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">关键认知：高可用的成本是「复杂度 + 钱」，个人项目不该先付。</text></svg>", "d8": "<svg class=\"dgm\" viewBox=\"0 0 1040 424\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Consistency boundaries\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--line2)\"/></marker></defs><text x=\"24\" y=\"24\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.5\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">一致性边界：什么是强一致，什么是最终一致，为什么不需要分布式事务</text><rect x=\"24\" y=\"44\" width=\"470\" height=\"166\" rx=\"12\" fill=\"var(--bg3)\" stroke=\"var(--ac2)\" stroke-width=\"1.6\" opacity=\"1\"/><text x=\"42\" y=\"68\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12.3\" fill=\"var(--ac2)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">强一致 · 单库事务 / Strong (single-DB transaction)</text><rect x=\"42\" y=\"80\" width=\"434\" height=\"56\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M43 91 a10 10 0 0 1 10 -10 h0 v54 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac2)\"/><text x=\"56\" y=\"98\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.2\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">一次模型调用 = 一个事务</text><text x=\"56\" y=\"112\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">同时写 model_calls(可删轨迹) + usage_ledger(只增账本)</text><text x=\"56\" y=\"126\" font-family=\"ui-monospace,Menlo,Consolas,monospace\" font-size=\"10.2\" fill=\"var(--ac2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">要么都成功，要么都不写 —— 不会出现「Run 成功但账没记」</text><rect x=\"42\" y=\"144\" width=\"434\" height=\"56\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac2)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M43 155 a10 10 0 0 1 10 -10 h0 v54 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac2)\"/><text x=\"56\" y=\"162\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.2\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">文档导入 = 一个事务</text><text x=\"56\" y=\"176\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">document + evidence_items + chunks + 向量一起提交</text><text x=\"56\" y=\"190\" font-family=\"ui-monospace,Menlo,Consolas,monospace\" font-size=\"10.2\" fill=\"var(--ac2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">部分失败不会留下「有向量但没文档」的孤儿数据</text><rect x=\"514\" y=\"44\" width=\"502\" height=\"166\" rx=\"12\" fill=\"var(--bg3)\" stroke=\"var(--ac3)\" stroke-width=\"1.6\" opacity=\"1\"/><text x=\"532\" y=\"68\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12.3\" fill=\"var(--ac3)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">最终一致 · 跨系统 / Eventual (cross-system)</text><rect x=\"532\" y=\"80\" width=\"466\" height=\"56\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac3)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M533 91 a10 10 0 0 1 10 -10 h0 v54 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac3)\"/><text x=\"546\" y=\"98\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.2\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">Kafka → 审计投影</text><text x=\"546\" y=\"112\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">Run 结束后异步投影；消费者滞后时页面数字暂时偏旧</text><text x=\"546\" y=\"126\" font-family=\"ui-monospace,Menlo,Consolas,monospace\" font-size=\"10.2\" fill=\"var(--ac3)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">业务正确性不依赖它，所以可以最终一致</text><rect x=\"532\" y=\"144\" width=\"466\" height=\"56\" rx=\"10\" fill=\"var(--bg2)\" stroke=\"var(--ac3)\" stroke-width=\"1.5\" opacity=\"1\"/><path d=\"M533 155 a10 10 0 0 1 10 -10 h0 v54 h0 a10 10 0 0 1 -10 -10 z\" fill=\"var(--ac3)\"/><text x=\"546\" y=\"162\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"13.2\" fill=\"var(--tx)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">供应商账单快照</text><text x=\"546\" y=\"176\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.2\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">我的估算 vs 供应商实际账单，靠定期对账收敛</text><text x=\"546\" y=\"190\" font-family=\"ui-monospace,Menlo,Consolas,monospace\" font-size=\"10.2\" fill=\"var(--ac3)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">估算是运营遥测，账单才是事实来源（source of truth）</text><rect x=\"24\" y=\"224\" width=\"992\" height=\"82\" rx=\"12\" fill=\"var(--bg2)\" stroke=\"var(--ac4)\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"42\" y=\"248\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12.5\" fill=\"var(--ac4)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">为什么不需要分布式事务 / 2PC / Saga？</text><text x=\"42\" y=\"269\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">因为所有「必须原子」的东西都被我放进了同一个 PostgreSQL。Redis 里只有可重建的任务状态，Kafka 里只有可重放的事实。</text><text x=\"42\" y=\"287\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">这是主动的设计选择：与其引入 Saga 补偿逻辑，不如先把事务边界画在一个数据库里 —— 简单、可测试、能解释。</text><rect x=\"24\" y=\"320\" width=\"992\" height=\"88\" rx=\"12\" fill=\"var(--bg2)\" stroke=\"var(--ac5)\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"42\" y=\"344\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"12.5\" fill=\"var(--ac5)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">重复与乱序怎么办 / Duplicates &amp; ordering</text><text x=\"42\" y=\"365\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">Kafka 是 at-least-once（不是 exactly-once）→ 消费端按事件键幂等去重；重试上限 3 次，超过进 DLQ，避免一条毒消息卡住整个分区。</text><text x=\"42\" y=\"383\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--tx2)\" font-weight=\"400\" text-anchor=\"start\" opacity=\"1\">上传是 content_hash 幂等 → 重复点击不产生重复证据、不重复付 embedding 的钱。</text><text x=\"42\" y=\"401\" font-family=\"-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif\" font-size=\"11.3\" fill=\"var(--ac5)\" font-weight=\"700\" text-anchor=\"start\" opacity=\"1\">「恰好一次」不是消息系统送给你的，是你在消费端构造出来的。</text></svg>"}}</script>
<script>
"use strict";
var D=JSON.parse(document.getElementById('DATA').textContent);
var CH=D.chapters, DG=D.diagrams;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
function el(i){return document.getElementById(i);}
var SCR=null;function scroller(){return SCR||(SCR=el('scroller'));}
function jump(id){
  var n=el(id);if(!n)return;var m=scroller();
  var y=n.getBoundingClientRect().top-m.getBoundingClientRect().top+m.scrollTop-8;
  try{m.scrollTo({top:Math.max(0,y),behavior:'smooth'});}catch(e){m.scrollTop=y;}
}
function dgm(k,cap){
  return '<div class="dwrap">'+(DG[k]||'')+(cap?'<div class="dcap">'+esc(cap)+'</div>':'')+'</div>';
}
function block(b){
  var h = b.h ? '<h3 class="bh">'+esc(b.h)+'</h3>' : '';
  if(b.kind==='diagram') return h+dgm(b.diagram,b.dgm_cap);
  if(b.kind==='plain')
    return h+'<div class="plain"><div class="zhx">'+md(b.zh)+'</div><div class="enx">'+esc(b.en)+'</div></div>';
  if(b.kind==='steps')
    return h+'<div class="steps">'+b.items.map(function(i){
      return '<div class="st"><div class="zhx">'+md(i.zh)+'</div><div class="enx">'+esc(i.en)+'</div></div>';}).join('')+'</div>';
  if(b.kind==='pairs')
    return h+'<div class="pairs">'+b.items.map(function(i){
      return '<div class="pr">'+(i.k?'<div class="k">'+esc(i.k)+'</div>':'')+
        '<div class="zhx">'+md(i.zh)+'</div><div class="enx">'+esc(i.en)+'</div></div>';}).join('')+'</div>';
  if(b.kind==='status')
    return h+'<div class="stt">'+b.items.map(function(i){
      return '<div class="si '+b.tone+'"><div class="n">'+esc(i[0])+'</div>'+
        '<div><div class="d">'+esc(i[1])+'</div><div class="e">'+esc(i[2])+'</div></div></div>';}).join('')+'</div>';
  if(b.kind==='nfr')
    return h+b.items.map(function(i){
      return '<div class="nfr"><div class="t">'+esc(i.k)+'</div>'+
        '<div class="row"><span class="lb g">目标</span><span>'+esc(i.goal)+'</span></div>'+
        '<div class="row"><span class="lb n">现状</span><span>'+esc(i.now)+'</span></div>'+
        '<div class="row"><span class="lb x">差距</span><span>'+esc(i.gap)+'</span></div>'+
        '<div class="enx">'+esc(i.en)+'</div></div>';}).join('');
  if(b.kind==='sel')
    return h+b.items.map(function(i){
      return '<div class="sel"><div class="t">'+esc(i.t)+'</div><div class="alt">候选：'+esc(i.alt)+'</div>'+
        '<div class="pick">✓ '+esc(i.pick)+'</div>'+
        '<div class="g"><span class="gk">为什么</span><span>'+esc(i.why)+'</span></div>'+
        '<div class="g"><span class="gk">代价</span><span>'+esc(i.cost)+'</span></div>'+
        '<div class="g"><span class="gk">何时换</span><span>'+esc(i.when)+'</span></div>'+
        '<div class="enx">'+esc(i.en)+'</div></div>';}).join('');
  if(b.kind==='risk')
    return h+b.items.map(function(i){
      return '<div class="rk"><div class="t">'+esc(i[0])+'</div><div class="w">'+esc(i[1])+'</div>'+
        '<div class="m">'+esc(i[2])+'</div><div class="enx">'+esc(i[3])+'</div></div>';}).join('');
  if(b.kind==='rank'||b.kind==='road'){
    var col={'高':'var(--ac5)','中':'var(--ac3)','低':'var(--ac2)',
             'P0':'var(--ac5)','P1':'var(--ac3)','P2':'var(--ac)','P3':'var(--tx3)'};
    return h+b.items.map(function(i){
      return '<div class="rr"><div class="p" style="background:'+(col[i[0]]||'var(--ac)')+'">'+esc(i[0])+'</div>'+
        '<div><div class="t">'+esc(i[1])+(i.length>4?'<span class="m">'+esc(i[3])+'</span>':'')+'</div>'+
        '<div class="zhx">'+esc(i[2])+'</div>'+
        '<div class="enx">'+esc(i[i.length-1])+'</div></div></div>';}).join('');
  }
  return h;
}
function render(){
  var h='<h1 style="margin:0 0 4px;font-size:26px">Argus 系统设计手册</h1>'+
    '<p style="color:var(--tx2);font-size:13.6px;margin:0 0 8px">System Design Handbook · 12 章 · 8 张架构图 · 每个知识点中英对照</p>'+
    '<div class="lead" style="margin-bottom:22px">这份手册回答系统设计面试的标准问题清单：架构怎么设计的、请求怎么流转、做了什么没做什么、'+
    '非功能需求、性能瓶颈、数据如何转换、技术如何选型、哪些故障不可控、跑在什么基础设施上、机器挂了怎么办、一致性和稳定性如何保证、还能怎么改进。'+
    '<span class="le">Every section pairs a Chinese explanation with an English line you can say out loud. '+
    'Each chapter ends with a 30–45 second spoken summary.</span></div>'+
    '<div class="toc">'+CH.map(function(c){
      return '<div class="tc" onclick="jump(\''+c.id+'\')"><b>'+c.n+'</b><div>'+
        '<div class="t1">'+esc(c.title)+'</div><div class="t2">'+esc(c.tz)+'</div></div></div>';}).join('')+'</div>';
  CH.forEach(function(c){
    h+='<section class="ch" id="'+c.id+'">'+
      '<div class="chh"><div class="chn">'+c.n+'</div><div><h2>'+esc(c.title)+'</h2>'+
      '<div class="zh">'+esc(c.tz)+'</div></div></div>'+
      '<div class="lead">'+md(c.lead_zh)+'<span class="le">'+esc(c.lead_en)+'</span></div>'+
      (c.diagram?dgm(c.diagram,c.dgm_cap):'')+
      c.blocks.map(block).join('')+
      '<div class="say"><div class="h">▶ 面试这样说 · SAY IT LIKE THIS（30–45s）</div><div class="b">'+esc(c.say)+'</div></div>'+
      '</section>';
  });
  el('body').innerHTML=h;
  el('nav').innerHTML='<option value="">跳转到章节…</option>'+CH.map(function(c){
    return '<option value="'+c.id+'">'+c.n+' · '+esc(c.title)+' / '+esc(c.tz)+'</option>';}).join('');
}
/* theme + zoom */
var MEM={};
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r===null?(k in MEM?MEM[k]:null):r;}localStorage.setItem(k,v);MEM[k]=v;return v;}catch(e){if(v===undefined)return(k in MEM?MEM[k]:null);MEM[k]=v;return v;}}
var ZS=[0.9,1,1.15,1.3,1.5],zi=1;
function setTheme(t){document.body.className=t;ls('sd.theme',t);var s=el('theme');if(s)s.value=t;}
function setZoom(d){if(d===0)zi=1;else zi=Math.max(0,Math.min(ZS.length-1,zi+d));
  document.documentElement.style.setProperty('--zoom',ZS[zi]);ls('sd.zoom',String(zi));
  var l=el('zlab');if(l)l.textContent=Math.round(ZS[zi]*100)+'%';}
render();
(function(){var t=ls('sd.theme')||'t-light';document.body.className=t;
  var z=parseInt(ls('sd.zoom')||'1',10);zi=isNaN(z)?1:z;
  document.documentElement.style.setProperty('--zoom',ZS[zi]);
  var s=el('theme');if(s)s.value=t;var l=el('zlab');if(l)l.textContent=Math.round(ZS[zi]*100)+'%';})();
</script>
</body>
</html>
