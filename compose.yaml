name: argus

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn investment_agent.app:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ARGUS_ENV: development
      ARGUS_DATABASE_URL: postgresql+psycopg://argus:argus@postgres:5432/argus
      ARGUS_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      ARGUS_ENABLE_CLOUD_SERVICES: "${ARGUS_ENABLE_CLOUD_SERVICES:-false}"
      ARGUS_ENABLE_GMAIL: "false"
      ARGUS_ENABLE_EXTERNAL_MARKET_DATA: "${ARGUS_ENABLE_EXTERNAL_MARKET_DATA:-false}"
      ARGUS_ENABLE_ROBINHOOD: "${ARGUS_ENABLE_ROBINHOOD:-false}"
      ARGUS_MARKET_DATA_PROVIDER: "${ARGUS_MARKET_DATA_PROVIDER:-01}"
      ARGUS_ENABLE_MARKET_HEATMAP: "${ARGUS_ENABLE_MARKET_HEATMAP:-false}"
      ARGUS_ENABLE_UNIFIED_ETF_UNIVERSE: "${ARGUS_ENABLE_UNIFIED_ETF_UNIVERSE:-false}"
      ARGUS_ROBINHOOD_SIDECAR_URL: "${ARGUS_ROBINHOOD_SIDECAR_URL:-http://host.docker.internal:8765}"
      ARGUS_ROBINHOOD_SIDECAR_TOKEN: "${ARGUS_ROBINHOOD_SIDECAR_TOKEN:-}"
      ARGUS_ROBINHOOD_APPROVED_MANIFEST: "${ARGUS_ROBINHOOD_APPROVED_MANIFEST:-}"
      ARGUS_ROBINHOOD_ENABLE_HISTORICALS: "${ARGUS_ROBINHOOD_ENABLE_HISTORICALS:-false}"
      ARGUS_MODEL_PROVIDER: "${ARGUS_MODEL_PROVIDER:-auto}"
      ARGUS_MODEL_TIMEOUT_MS: "${ARGUS_MODEL_TIMEOUT_MS:-20000}"
      ARGUS_MODEL_MAX_ATTEMPTS: "${ARGUS_MODEL_MAX_ATTEMPTS:-3}"
      ARGUS_MODEL_RETRY_BACKOFF_MS: "${ARGUS_MODEL_RETRY_BACKOFF_MS:-100}"
      ARGUS_MARKET_ANALYSIS_TIMEOUT_MS: "${ARGUS_MARKET_ANALYSIS_TIMEOUT_MS:-60000}"
      ARGUS_MARKET_ANALYSIS_MAX_ATTEMPTS: "${ARGUS_MARKET_ANALYSIS_MAX_ATTEMPTS:-1}"
      ARGUS_MARKET_ANALYSIS_MAX_OUTPUT_TOKENS: "${ARGUS_MARKET_ANALYSIS_MAX_OUTPUT_TOKENS:-1600}"
      ARGUS_MARKET_ANALYSIS_TRACE_RETENTION_COUNT: "${ARGUS_MARKET_ANALYSIS_TRACE_RETENTION_COUNT:-50}"
      ARGUS_MARKET_ANALYSIS_TRACE_RETENTION_DAYS: "${ARGUS_MARKET_ANALYSIS_TRACE_RETENTION_DAYS:-30}"
      ARGUS_ETF_SELECTION_ENGINE: "${ARGUS_ETF_SELECTION_ENGINE:-deterministic}"
      ARGUS_GEMINI_API_KEY: "${ARGUS_GEMINI_API_KEY:-}"
      ARGUS_GEMINI_MODEL: "${ARGUS_GEMINI_MODEL:-gemini-3.1-flash-lite}"
      ARGUS_GEMINI_EMBEDDING_MODEL: "${ARGUS_GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}"
      ARGUS_GEMINI_EMBEDDING_DIMENSIONS: "${ARGUS_GEMINI_EMBEDDING_DIMENSIONS:-768}"
      ARGUS_GEMINI_INPUT_COST_PER_MILLION: "${ARGUS_GEMINI_INPUT_COST_PER_MILLION:-0.25}"
      ARGUS_GEMINI_OUTPUT_COST_PER_MILLION: "${ARGUS_GEMINI_OUTPUT_COST_PER_MILLION:-1.50}"
      ARGUS_DEEPSEEK_API_KEY: "${ARGUS_DEEPSEEK_API_KEY:-}"
      ARGUS_DEEPSEEK_MODEL: "${ARGUS_DEEPSEEK_MODEL:-deepseek-v4-flash}"
      ARGUS_DEEPSEEK_BASE_URL: "${ARGUS_DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      ARGUS_DEEPSEEK_INPUT_COST_PER_MILLION: "${ARGUS_DEEPSEEK_INPUT_COST_PER_MILLION:-0.14}"
      ARGUS_DEEPSEEK_OUTPUT_COST_PER_MILLION: "${ARGUS_DEEPSEEK_OUTPUT_COST_PER_MILLION:-0.28}"
      ARGUS_DEEPSEEK_PRO_MODEL: "${ARGUS_DEEPSEEK_PRO_MODEL:-deepseek-v4-pro}"
      ARGUS_DEEPSEEK_PRO_INPUT_COST_PER_MILLION: "${ARGUS_DEEPSEEK_PRO_INPUT_COST_PER_MILLION:-0.435}"
      ARGUS_DEEPSEEK_PRO_OUTPUT_COST_PER_MILLION: "${ARGUS_DEEPSEEK_PRO_OUTPUT_COST_PER_MILLION:-0.87}"
      ARGUS_KIMI_API_KEY: "${ARGUS_KIMI_API_KEY:-}"
      ARGUS_KIMI_MODEL: "${ARGUS_KIMI_MODEL:-kimi-k2.6}"
      ARGUS_KIMI_BASE_URL: "${ARGUS_KIMI_BASE_URL:-https://api.moonshot.ai/v1}"
      ARGUS_KIMI_TIMEOUT_MS: "${ARGUS_KIMI_TIMEOUT_MS:-60000}"
      ARGUS_KIMI_INPUT_COST_PER_MILLION: "${ARGUS_KIMI_INPUT_COST_PER_MILLION:-0.95}"
      ARGUS_KIMI_OUTPUT_COST_PER_MILLION: "${ARGUS_KIMI_OUTPUT_COST_PER_MILLION:-4.00}"
      ARGUS_KIMI_CANDIDATE_MODEL: "${ARGUS_KIMI_CANDIDATE_MODEL:-}"
      ARGUS_KIMI_CANDIDATE_INPUT_COST_PER_MILLION: "${ARGUS_KIMI_CANDIDATE_INPUT_COST_PER_MILLION:-0}"
      ARGUS_KIMI_CANDIDATE_OUTPUT_COST_PER_MILLION: "${ARGUS_KIMI_CANDIDATE_OUTPUT_COST_PER_MILLION:-0}"
      ARGUS_OPENAI_API_KEY: "${ARGUS_OPENAI_API_KEY:-}"
      ARGUS_OPENAI_MODEL: "${ARGUS_OPENAI_MODEL:-gpt-5.5}"
      ARGUS_OPENAI_BASE_URL: "${ARGUS_OPENAI_BASE_URL:-https://api.openai.com/v1}"
      ARGUS_OPENAI_INPUT_COST_PER_MILLION: "${ARGUS_OPENAI_INPUT_COST_PER_MILLION:-5.0}"
      ARGUS_OPENAI_OUTPUT_COST_PER_MILLION: "${ARGUS_OPENAI_OUTPUT_COST_PER_MILLION:-30.0}"
      ARGUS_MODEL_BENCHMARK_MAX_COST_USD: "${ARGUS_MODEL_BENCHMARK_MAX_COST_USD:-0.10}"
      ARGUS_EXA_API_KEY: "${ARGUS_EXA_API_KEY:-}"
      ARGUS_EXA_BASE_URL: "${ARGUS_EXA_BASE_URL:-https://api.exa.ai}"
      ARGUS_EXA_SEARCH_TYPE: "${ARGUS_EXA_SEARCH_TYPE:-auto}"
      ARGUS_EXA_TIMEOUT_MS: "${ARGUS_EXA_TIMEOUT_MS:-15000}"
      ARGUS_EXA_MAX_RESULTS: "${ARGUS_EXA_MAX_RESULTS:-5}"
      ARGUS_EXA_HIGHLIGHT_MAX_CHARACTERS: "${ARGUS_EXA_HIGHLIGHT_MAX_CHARACTERS:-2000}"
      ARGUS_EXA_SEARCH_COST_PER_REQUEST: "${ARGUS_EXA_SEARCH_COST_PER_REQUEST:-0.007}"
      ARGUS_WEB_SEARCH_MAX_CALLS: "${ARGUS_WEB_SEARCH_MAX_CALLS:-2}"
      ARGUS_TOOL_TIMEOUT_MS: "${ARGUS_TOOL_TIMEOUT_MS:-10000}"
      ARGUS_TOOL_MAX_ATTEMPTS: "${ARGUS_TOOL_MAX_ATTEMPTS:-3}"
      ARGUS_TOOL_RETRY_BACKOFF_MS: "${ARGUS_TOOL_RETRY_BACKOFF_MS:-100}"
      ARGUS_DOCUMENT_UPLOAD_MAX_BYTES: "${ARGUS_DOCUMENT_UPLOAD_MAX_BYTES:-26214400}"
      ARGUS_DOCUMENT_PDF_MAX_PAGES: "${ARGUS_DOCUMENT_PDF_MAX_PAGES:-500}"
      ARGUS_DOCUMENT_EXTRACTED_TEXT_MAX_CHARACTERS: "${ARGUS_DOCUMENT_EXTRACTED_TEXT_MAX_CHARACTERS:-2000000}"
      ARGUS_DOCUMENT_EXTRACTION_TIMEOUT_SECONDS: "${ARGUS_DOCUMENT_EXTRACTION_TIMEOUT_SECONDS:-90}"
      ARGUS_DOCUMENT_EXTRACTION_WARNING_RSS_BYTES: "${ARGUS_DOCUMENT_EXTRACTION_WARNING_RSS_BYTES:-1073741824}"
      ARGUS_DOCUMENT_EXTRACTION_MAX_RSS_BYTES: "${ARGUS_DOCUMENT_EXTRACTION_MAX_RSS_BYTES:-1610612736}"
      ARGUS_DOCUMENT_RESOURCE_POLL_INTERVAL_MS: "${ARGUS_DOCUMENT_RESOURCE_POLL_INTERVAL_MS:-500}"
      ARGUS_DOCUMENT_RESOURCE_TERMINATE_GRACE_SECONDS: "${ARGUS_DOCUMENT_RESOURCE_TERMINATE_GRACE_SECONDS:-5}"
      ARGUS_DOCUMENT_ADMISSION_MEMORY_RATIO: "${ARGUS_DOCUMENT_ADMISSION_MEMORY_RATIO:-0.70}"
      ARGUS_DOCUMENT_UPLOAD_ROOT: "${ARGUS_DOCUMENT_UPLOAD_ROOT:-/app/data/uploads}"
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./docs:/app/docs:ro
      - ./report_templates:/app/report_templates:ro
      - ./evals:/app/evals:ro
      - ./examples:/app/examples:ro
      - ./eval-results:/app/eval-results
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    mem_limit: 512m

volumes:
  postgres_data:
  frontend_node_modules:
