services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  kafka:
    image: apache/kafka:3.8.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    mem_limit: 1g

  backend:
    environment:
      ARGUS_REDIS_URL: redis://redis:6379/0
      ARGUS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ARGUS_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_started}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./scripts:/app/scripts:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: argus-worker
    environment:
      ARGUS_ENV: development
      ARGUS_DATABASE_URL: postgresql+psycopg://argus:argus@postgres:5432/argus
      ARGUS_REDIS_URL: redis://redis:6379/0
      ARGUS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_started}
    mem_limit: 2g

  event-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: argus-event-consumer
    environment:
      ARGUS_ENV: development
      ARGUS_DATABASE_URL: postgresql+psycopg://argus:argus@postgres:5432/argus
      ARGUS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ARGUS_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      ARGUS_KAFKA_CONSUMER_GROUP: argus-audit-metrics-v1
      ARGUS_KAFKA_CONSUMER_MAX_ATTEMPTS: 3
      ARGUS_KAFKA_AUDIT_RETENTION_COUNT: 5000
      ARGUS_KAFKA_AUDIT_RETENTION_DAYS: 30
    volumes:
      - ./src:/app/src
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
      backend: {condition: service_healthy}
    mem_limit: 512m

volumes:
  redis_data:
