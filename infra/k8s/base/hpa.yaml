apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: argus-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: argus-worker
  minReplicas: 1
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
