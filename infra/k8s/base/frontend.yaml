apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: argus-frontend}
  template:
    metadata:
      labels: {app: argus-frontend}
    spec:
      containers:
        - name: frontend
          image: ARGUS_FRONTEND_IMAGE
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
---
apiVersion: v1
kind: Service
metadata:
  name: argus-frontend
spec:
  selector: {app: argus-frontend}
  ports:
    - {name: http, port: 8080, targetPort: http}
