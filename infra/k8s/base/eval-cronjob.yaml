apiVersion: batch/v1
kind: CronJob
metadata:
  name: argus-eval
spec:
  schedule: "0 9 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: argus
          restartPolicy: Never
          containers:
            - name: eval
              image: ARGUS_BACKEND_IMAGE
              command: ["argus-eval"]
              envFrom:
                - configMapRef: {name: argus-config}
                - secretRef: {name: argus-secrets}
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {cpu: "1", memory: 1Gi}
